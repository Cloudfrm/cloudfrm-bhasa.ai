<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>भाषा · डेसबोर्ड</title>
  <meta name="theme-color" id="theme-color" content="#f4fbf8" />
  <link rel="icon" href="/static/assets/cloudfrm-logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="/static/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/static/css/dashboard.css" />
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar card">
      <div class="brand">
        <img class="mark" src="/static/assets/cloudfrm-logo.png" alt="CloudFRM logo" width="44" height="44" />
        <div>
          <h1>भाषा</h1>
          <small id="brand-sub">ग्राहक सेवा डेसबोर्ड</small>
        </div>
      </div>
      <nav>
        <button type="button" id="nav-home" class="active" data-view="home"></button>
        <button type="button" id="nav-chat" data-view="chat"></button>
        <button type="button" id="nav-call" data-view="call"></button>
        <button type="button" id="nav-settings" data-view="settings"></button>
      </nav>
      <div class="grow"></div>
      <div class="lang-switch">
        <button type="button" id="lang-ne" class="pill active">नेपाली</button>
        <button type="button" id="lang-en" class="pill">English</button>
      </div>
    </aside>
    <div class="main card">
      <header class="topbar">
        <div>
          <h2 id="page-title"></h2>
          <div class="status"><span class="dot" id="status-dot"></span><span id="live"></span></div>
        </div>
        <div class="controls">
          <button type="button" id="speak-toggle" class="pill active"></button>
          <button type="button" id="theme-toggle" class="pill" aria-label="Toggle light and dark theme" aria-pressed="false">
            <svg class="i-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="i-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <span id="theme-label"></span>
          </button>
        </div>
      </header>
      <div class="stage home" id="stage">
        <section class="home" id="view-home">
          <h2 id="home-title"></h2>
          <p class="lede" id="home-lede"></p>
          <div class="stats">
            <div class="stat"><span id="stat-chat-label"></span><strong id="stat-chat">0</strong></div>
            <div class="stat"><span id="stat-call-label"></span><strong id="stat-call">0</strong></div>
            <div class="stat"><span id="stat-ticket-label"></span><strong id="stat-ticket">0</strong></div>
          </div>
          <div class="doors">
            <button type="button" class="door" data-go="chat">
              <span id="door-chat-kicker"></span>
              <h3 id="door-chat-title"></h3>
              <p id="door-chat-body"></p>
            </button>
            <button type="button" class="door" data-go="call">
              <span id="door-call-kicker"></span>
              <h3 id="door-call-title"></h3>
              <p id="door-call-body"></p>
            </button>
          </div>
        </section>
        <aside class="inbox hidden" id="inbox-pane">
          <header>
            <h3 id="inbox-title"></h3>
            <button type="button" class="new" id="new-thread"></button>
          </header>
          <div class="list" id="inbox-list"></div>
        </aside>
        <aside class="chat-inbox hidden" id="chat-inbox">
          <div class="chat-inbox__head">
            <h3><span id="chat-inbox-title"></span><span class="chat-inbox__count" id="chat-inbox-count">0</span></h3>
            <button type="button" class="inbox-toggle" id="inbox-toggle" aria-expanded="true"></button>
          </div>
          <button type="button" class="chat-inbox__new" id="chat-new"></button>
          <div class="chat-inbox__list" id="chat-list"></div>
          <div class="tz-note" id="chat-tz"></div>
          <div class="chat-inbox__foot tickets" id="ticket-box">
            <h4 id="tickets-label"></h4>
            <div id="ticket-list"></div>
          </div>
        </aside>
        <section class="room hidden" id="view-chat">
          <header class="room__head">
            <div>
              <h3 class="room__title" id="room-title"></h3>
              <p class="room__sub" id="room-sub"></p>
            </div>
            <span class="room__tag" id="room-tag"></span>
          </header>
          <div class="room__topics">
            <span class="room__topics-label" id="topics-label"></span>
            <div id="chips"></div>
          </div>
          <div id="log" role="log" aria-live="polite"></div>
          <button type="button" class="jump-latest" id="jump-latest" hidden></button>
          <div class="conn-banner" id="conn-banner" role="status" hidden>
            <span id="conn-text"></span>
            <button type="button" id="conn-action" hidden></button>
          </div>
          <div class="desk-bar">
            <form id="form">
              <button id="mic" type="button"></button>
              <textarea id="box" rows="1" autocomplete="off" maxlength="2000" aria-describedby="unicoder"></textarea>
              <button id="send" type="submit"></button>
            </form>
            <div id="unicoder" class="unicoder idle" aria-live="polite"></div>
          </div>
        </section>
        <section class="desk hidden" id="view-call">
          <div class="call-stage">
            <div class="ring" id="ring">भा</div>
            <div class="call-copy">
              <h3 id="call-title"></h3>
              <p id="call-body"></p>
            </div>
            <div class="call-actions">
              <button type="button" id="pickup"></button>
              <button type="button" id="hangup" class="hidden"></button>
            </div>
            <div id="call-log"></div>
          </div>
        </section>
        <section class="settings hidden" id="view-settings">
          <h2 id="settings-title"></h2>
          <p id="settings-body"></p>
        </section>
      </div>
    </div>
  </div>
  <script src="/static/js/dashboard.js" defer></script>
</body>
</html>
