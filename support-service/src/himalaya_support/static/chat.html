<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>bhasa · ग्राहक सेवा</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #f4f7f5;
      --muted: #c3d4ce;
      --line: rgba(255, 255, 255, 0.16);
      --glass: rgba(255, 255, 255, 0.1);
      --glass-hi: rgba(255, 255, 255, 0.16);
      --glass-mid: rgba(255, 255, 255, 0.08);
      --gold: #e0c078;
      --gold-deep: #8f6d2a;
      --leaf: #8fe3cf;
      --crimson: #ff6b7a;
      --blur: 28px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "Noto Sans Devanagari", "Segoe UI", sans-serif;
      background: #061310;
      overflow: hidden;
      color-scheme: dark;
    }
    .atmosphere {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(980px 700px at 8% 12%, rgba(224, 192, 120, 0.55), transparent 58%),
        radial-gradient(860px 760px at 92% 8%, rgba(46, 200, 168, 0.55), transparent 56%),
        radial-gradient(720px 560px at 78% 92%, rgba(255, 107, 122, 0.32), transparent 58%),
        radial-gradient(560px 460px at 12% 86%, rgba(90, 210, 196, 0.4), transparent 52%),
        linear-gradient(165deg, #04110e 0%, #0a2621 48%, #12352c 100%);
    }
    .atmosphere .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.7;
      animation: drift 22s ease-in-out infinite;
    }
    .orb-a { width: 340px; height: 340px; left: 8%; top: 18%; background: rgba(224, 192, 120, 0.45); }
    .orb-b { width: 420px; height: 420px; right: 4%; top: -8%; background: rgba(47, 170, 148, 0.4); animation-delay: -7s; }
    .orb-c { width: 280px; height: 280px; right: 22%; bottom: 4%; background: rgba(255, 107, 122, 0.28); animation-delay: -13s; }
    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(28px, -22px) scale(1.08); }
    }
    .glass {
      background: var(--glass);
      backdrop-filter: blur(var(--blur)) saturate(165%);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(165%);
      border: 1px solid var(--line);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }
    .shell {
      position: relative;
      z-index: 1;
      height: 100%;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 14px;
      padding: 14px;
    }
    aside {
      color: #f6f3ec;
      padding: 28px 22px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      border-radius: 24px;
      min-height: 0;
      overflow: auto;
    }
    .brand { display: flex; gap: 12px; align-items: center; }
    .mark {
      width: 42px; height: 42px; border-radius: 14px;
      background: linear-gradient(145deg, var(--gold), var(--gold-deep));
      color: #0b3a32;
      font-family: "Source Serif 4", Georgia, serif;
      font-weight: 700; font-size: 22px;
      display: grid; place-items: center;
      box-shadow: 0 8px 20px rgba(224, 192, 120, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.45);
    }
    .brand h1 { margin: 0; font-size: 26px; font-family: "Source Serif 4", Georgia, serif; letter-spacing: 0.02em; }
    .brand small { display: block; color: #d5e4df; font-size: 12px; font-weight: 500; margin-top: 2px; }
    .aside-copy { margin: 0; color: #d5e4df; font-size: 14px; line-height: 1.55; }
    .topics { display: flex; flex-direction: column; gap: 8px; }
    .topics span { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #c3d4ce; }
    .topics button {
      text-align: left;
      border: 1px solid var(--line);
      background: var(--glass-mid);
      color: #f6f3ec;
      border-radius: 12px;
      padding: 10px 12px;
      font: inherit;
      cursor: pointer;
      transition: background .2s, border-color .2s;
    }
    .topics button:hover {
      border-color: rgba(224, 192, 120, 0.5);
      background: var(--glass-hi);
    }
    .trust {
      margin-top: auto;
      padding: 12px;
      border-radius: 14px;
      background: var(--glass-mid);
      border: 1px solid var(--line);
      color: #d5e4df;
      font-size: 12px;
      line-height: 1.5;
    }
    .desk {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-radius: 24px;
      overflow: hidden;
    }
    header.bar {
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
      padding: 16px 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.06);
    }
    .status { display: flex; align-items: center; gap: 8px; color: var(--leaf); font-weight: 600; font-size: 14px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #3fd19a; box-shadow: 0 0 10px #3fd19a; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    .controls button {
      border: 1px solid var(--line);
      background: var(--glass-mid);
      color: var(--ink);
      border-radius: 999px;
      padding: 7px 12px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .controls button.active {
      background: linear-gradient(145deg, var(--gold), #c4a35a);
      color: #0b3a32;
      border-color: rgba(224, 192, 120, 0.7);
    }
    #log { flex: 1; overflow: auto; padding: 28px; display: flex; flex-direction: column; gap: 16px; }
    .welcome {
      background: var(--glass-mid);
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 22px;
      max-width: 640px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }
    .welcome h2 { margin: 0 0 8px; font-size: 22px; font-family: "Source Serif 4", Georgia, serif; }
    .welcome p { margin: 0; color: var(--muted); line-height: 1.5; }
    .turn { display: flex; flex-direction: column; gap: 6px; max-width: 640px; }
    .turn.member { align-self: flex-end; align-items: flex-end; }
    .who { font-size: 12px; color: var(--muted); font-weight: 600; }
    .bubble {
      padding: 12px 14px;
      border-radius: 16px;
      line-height: 1.55;
      white-space: pre-wrap;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .member .bubble {
      background: rgba(224, 192, 120, 0.28);
      border: 1px solid rgba(224, 192, 120, 0.42);
      color: #fff8e8;
    }
    .agent .bubble {
      background: var(--glass-hi);
      border: 1px solid var(--line);
    }
    .err .bubble { background: rgba(255, 107, 122, 0.18); border-color: rgba(255, 107, 122, 0.45); color: #ffd0d5; }
    .play {
      border: 0; background: transparent; color: var(--leaf); font: inherit;
      font-size: 13px; font-weight: 600; cursor: pointer; padding: 0;
    }
    .loading { color: var(--muted); display: flex; align-items: center; gap: 10px; }
    .dots { display: inline-flex; gap: 4px; }
    .dots span {
      width: 7px; height: 7px; border-radius: 50%; background: var(--gold);
      animation: bounce 1s infinite ease-in-out;
    }
    .dots span:nth-child(2) { animation-delay: .15s; }
    .dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: .35; }
      40% { transform: translateY(-5px); opacity: 1; }
    }
    .composer {
      padding: 16px 28px 22px;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.06);
    }
    .composer form { display: flex; gap: 8px; }
    .composer input {
      flex: 1; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line);
      font: inherit; background: var(--glass-mid); color: var(--ink);
    }
    .composer input::placeholder { color: #9bb4ad; }
    .composer input:focus { outline: 2px solid rgba(224, 192, 120, 0.45); border-color: var(--gold); }
    .unicoder {
      min-height: 24px; margin-top: 8px; color: var(--leaf);
      font-weight: 600; font-size: 16px; line-height: 1.4;
    }
    .unicoder.idle { color: var(--muted); font-weight: 500; font-size: 13px; }
    .composer button {
      border: 0; border-radius: 14px; padding: 12px 16px; font: inherit; font-weight: 700; cursor: pointer;
    }
    #send {
      background: linear-gradient(145deg, var(--gold), #c4a35a);
      color: #0b3a32;
      min-width: 108px;
      box-shadow: 0 8px 18px rgba(224, 192, 120, 0.25);
    }
    #mic {
      background: var(--glass-hi);
      color: var(--ink);
      border: 1px solid var(--line) !important;
      min-width: 52px;
    }
    #mic.hot { background: var(--crimson); color: #fff; border-color: var(--crimson) !important; }
    button:disabled { opacity: .55; }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .glass, .welcome, .bubble { background: rgba(18, 48, 42, 0.92); }
    }
    @media (prefers-reduced-motion: reduce) {
      .atmosphere .orb { animation: none; }
    }
    @media (max-width: 860px) {
      body { overflow: auto; }
      .shell { grid-template-columns: 1fr; height: auto; min-height: 100vh; }
      aside { padding: 18px 16px 12px; }
      .topics { flex-direction: row; flex-wrap: wrap; }
      .topics button { flex: 1 1 140px; }
      .trust { margin-top: 0; }
      .desk { min-height: 70vh; }
      header.bar, #log, .composer { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
  </div>
  <div class="shell">
    <aside class="glass">
      <div class="brand">
        <div class="mark">भा</div>
        <div>
          <h1 lang="en">bhasa</h1>
          <small id="domain">bhasai.ai</small>
        </div>
      </div>
      <p class="aside-copy" id="aside-copy">सहकारी र बैंकका सदस्यका लागि नेपाली ग्राहक सेवा। च्याटबोट होइन — तपाईंको खाता, रकम र ऋणको सहयोग।</p>
      <div class="topics">
        <span id="topics-label">साझा विषय</span>
        <button type="button" data-ne="मोबाइल बैंकिङमा लगइन गर्न सकिएन" data-en="I cannot sign in to mobile banking">मोबाइल बैंकिङ</button>
        <button type="button" data-ne="मेरो पिन बिर्सें" data-en="I forgot my PIN">पिन / पासवर्ड</button>
        <button type="button" data-ne="रकम पठाएँ तर पुगेन" data-en="I sent money but it did not arrive">रकम स्थानान्तरण</button>
        <button type="button" data-ne="ऋण किस्ता कहिले तिर्ने?" data-en="When is my loan instalment due?">ऋण / किस्ता</button>
        <button type="button" data-ne="केवाईसी कसरी गर्ने?" data-en="How do I complete KYC?">केवाईसी / खाता</button>
        <button type="button" data-ne="कार्ड हरायो, के गर्ने?" data-en="My card is lost. What should I do?">कार्ड / एटीएम</button>
        <button type="button" data-ne="बचत खाताको ब्याजदर कति हो?" data-en="What is the savings interest rate?">ब्याजदर</button>
        <button type="button" data-ne="एटिएमबाट दैनिक कति झिक्न सकिन्छ?" data-en="What is the daily ATM limit?">एटीएम सीमा</button>
        <button type="button" data-ne="शाखा कति बजे खुल्छ?" data-en="What time does the branch open?">शाखा समय</button>
      </div>
      <div class="trust" id="trust">पिन, पासवर्ड वा ओटीपी यहाँ नलेख्नुहोस्। bhasa ले ती कहिल्यै माग्दैन।</div>
    </aside>
    <section class="desk glass">
      <header class="bar">
        <div class="status"><span class="dot"></span><span id="live">सेवा खुला · ग्राहक सेवा</span></div>
        <div class="controls">
          <button type="button" id="lang-ne" class="active">नेपाली</button>
          <button type="button" id="lang-en">English</button>
          
        </div>
      </header>
      <div id="log"></div>
      <div class="composer">
        <form id="form">
          
          <input id="box" autocomplete="off" />
          <button id="send" type="submit">पठाउनुहोस्</button>
        </form>
        <div id="unicoder" class="unicoder idle"></div>
      </div>
    </section>
  </div>
  <script>
    const copy = {
      ne: {
        aside: "सहकारी र बैंकका सदस्यका लागि नेपाली ग्राहक सेवा। च्याटबोट होइन — तपाईंको खाता, रकम र ऋणको सहयोग।",
        topics: "साझा विषय",
        trust: "पिन, पासवर्ड वा ओटीपी यहाँ नलेख्नुहोस्। bhasa ले ती कहिल्यै माग्दैन।",
        live: "सेवा खुला · ग्राहक सेवा",
        welcomeTitle: "नमस्ते, म bhasa हुँ",
        welcomeBody: "लगइन, रकम स्थानान्तरण, ऋण किस्ता, केवाईसी वा कार्ड — बायाँबाट विषय छान्नुहोस् वा आफ्नो समस्या लेख्नुहोस्।",
        placeholder: "नेपाली वा अंग्रेजी अक्षरमा लेख्नुहोस्…",
        unicoderHint: "रोमन नेपाली शब्द-शब्द गरी देवनागरीमा बदलिन्छ; अंग्रेजी र संकेत (KYC, OTP) जस्ताको तस्तै रहन्छन्",
        unicoderLabel: "नेपालीमा: ",
        send: "पठाउनुहोस्",
        agent: "bhasa",
        member: "तपाईं",
        play: "सुन्नुहोस्",
        listen: "आवाज",
        micErr: "आवाजका लागि Chrome वा Edge प्रयोग गर्नुहोस्।",
        hearErr: "सुनिएन। कृपया लेख्नुहोस्।"
      },
      en: {
        aside: "Nepali customer support for cooperative and bank members. Not a chatbot — help with accounts, transfers, and loans.",
        topics: "Common issues",
        trust: "Never type a PIN, password, or OTP here. bhasa will never ask for them.",
        live: "Open · customer support",
        welcomeTitle: "Namaste, I am bhasa",
        welcomeBody: "Login, transfers, loan instalments, KYC, or cards — pick a topic on the left or describe your issue.",
        placeholder: "Type in Nepali or English…",
        unicoderHint: "Romanized Nepali converts word by word; English and codes (KYC, OTP) stay as typed",
        unicoderLabel: "Nepali: ",
        send: "Send",
        agent: "bhasa",
        member: "You",
        play: "Listen",
        listen: "Voice",
        micErr: "Voice input needs Chrome or Edge.",
        hearErr: "Could not hear that. Please type."
      }
    };

    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const box = document.getElementById("box");
    const send = document.getElementById("send");
    const mic = document.createElement("button") /* voice not deployed: no control in the DOM */;
    const speakToggle = document.createElement("button") /* voice not deployed */;
    const unicoderHint = document.getElementById("unicoder");
    let conversationId = null;
    let replyLang = localStorage.getItem("bhasa-lang") || "ne";
    let speakOn = localStorage.getItem("bhasa-speak") !== "off";
    let lastAudio = null;
    let started = false;
    let lastMemberBubble = null;
    let unicoderTimer = null;
    let unicoderReq = 0;

    function t() { return copy[replyLang]; }
    function hasLatin(text) { return /[A-Za-z]/.test(text || ""); }

    function paintChrome() {
      const c = t();
      document.documentElement.lang = replyLang === "ne" ? "ne" : "en";
      document.getElementById("aside-copy").textContent = c.aside;
      document.getElementById("topics-label").textContent = c.topics;
      document.getElementById("trust").textContent = c.trust;
      document.getElementById("live").textContent = c.live;
      box.placeholder = c.placeholder;
      send.textContent = c.send;
      speakToggle.textContent = c.listen;
      document.getElementById("lang-ne").classList.toggle("active", replyLang === "ne");
      document.getElementById("lang-en").classList.toggle("active", replyLang === "en");
      speakToggle.classList.toggle("active", speakOn);
      paintUnicoderHint();
    }

    function paintUnicoderHint(preview) {
      if (replyLang !== "ne") {
        unicoderHint.textContent = "";
        unicoderHint.className = "unicoder idle";
        return;
      }
      if (preview && preview !== box.value) {
        unicoderHint.className = "unicoder";
        unicoderHint.textContent = t().unicoderLabel + preview;
        return;
      }
      unicoderHint.className = "unicoder idle";
      unicoderHint.textContent = hasLatin(box.value) ? t().unicoderHint : t().unicoderHint;
    }

    async function toUnicoder(text) {
      const raw = text || "";
      if (!raw || !hasLatin(raw)) return raw;
      const res = await fetch("/v1/support/unicoder", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: raw })
      });
      const data = await res.json();
      return (res.ok && data.nepali) ? data.nepali : raw;
    }

    function pendingLatin(value) {
      const match = value.match(/[A-Za-z']+$/);
      return match ? match[0] : "";
    }

    async function convertComposer(commitCurrent) {
      const typed = box.value;
      if (replyLang !== "ne" || !hasLatin(typed)) {
        paintUnicoderHint();
        return typed;
      }
      const req = ++unicoderReq;
      const converted = await toUnicoder(typed);
      if (req !== unicoderReq) return typed;
      paintUnicoderHint(converted);
      const shouldReplace = commitCurrent || !pendingLatin(typed);
      if (shouldReplace && converted && converted !== typed && box.value === typed) {
        box.value = converted;
        paintUnicoderHint();
      }
      return converted;
    }

    function scheduleUnicoder() {
      clearTimeout(unicoderTimer);
      const typed = box.value;
      const commit = /[\s?؟।.!,\u0964]$/.test(typed) || !pendingLatin(typed);
      unicoderTimer = setTimeout(() => convertComposer(commit), commit ? 40 : 90);
    }

    function showWelcome() {
      log.innerHTML = "";
      const el = document.createElement("div");
      el.className = "welcome";
      el.innerHTML = "<h2>" + t().welcomeTitle + "</h2><p>" + t().welcomeBody + "</p>";
      log.appendChild(el);
      started = false;
    }

    function setLang(lang) {
      if (lang !== replyLang) conversationId = null;
      replyLang = lang;
      localStorage.setItem("bhasa-lang", lang);
      paintChrome();
      if (!started) showWelcome();
      convertComposer(true);
    }

    document.getElementById("lang-ne").addEventListener("click", () => setLang("ne"));
    document.getElementById("lang-en").addEventListener("click", () => setLang("en"));
    speakToggle.addEventListener("click", () => {
      speakOn = !speakOn;
      localStorage.setItem("bhasa-speak", speakOn ? "on" : "off");
      paintChrome();
    });

    document.querySelectorAll(".topics button").forEach((btn) => {
      btn.addEventListener("click", () => sendText(btn.getAttribute("data-" + replyLang)));
    });

    function addMember(text) {
      if (!started) { log.innerHTML = ""; started = true; }
      const wrap = document.createElement("div");
      wrap.className = "turn member";
      wrap.innerHTML = '<div class="who">' + t().member + "</div>";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      wrap.appendChild(bubble);
      log.appendChild(wrap);
      log.scrollTop = log.scrollHeight;
      lastMemberBubble = bubble;
      return bubble;
    }

    function addAgent(text, isErr, meta) {
      if (!started) { log.innerHTML = ""; started = true; }
      const wrap = document.createElement("div");
      wrap.className = "turn agent" + (isErr ? " err" : "");
      wrap.innerHTML = '<div class="who">' + t().agent + "</div>";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      wrap.appendChild(bubble);
      if (meta && meta.tickets && meta.tickets.length) {
        const note = document.createElement("div");
        note.className = "who";
        note.textContent = (replyLang === "ne" ? "टिकट: " : "Ticket: ") + meta.tickets.join(", ");
        wrap.appendChild(note);
      }
      if (!isErr) {
        const play = document.createElement("button");
        play.type = "button";
        play.className = "play";
        play.textContent = t().play;
        play.addEventListener("click", () => speakReply(text));
        wrap.appendChild(play);
        speakReply(text);
      }
      log.appendChild(wrap);
      log.scrollTop = log.scrollHeight;
    }

    function showLoading() {
      const el = document.createElement("div");
      el.className = "turn agent";
      el.id = "pending";
      el.innerHTML = '<div class="who">' + t().agent + '</div><div class="bubble loading"><span class="dots"><span></span><span></span><span></span></span></div>';
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
    }

    function clearLoading() {
      const pending = document.getElementById("pending");
      if (pending) pending.remove();
    }

    async function speakReply(text) {
      if (!speakOn || !text) return;
      try {
        const res = await fetch("/v1/support/speak", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, locale: replyLang })
        });
        const data = await res.json();
        if (res.ok && data.audio_base64) {
          if (lastAudio) lastAudio.pause();
          lastAudio = new Audio("data:" + (data.mime || "audio/mpeg") + ";base64," + data.audio_base64);
          lastAudio.play().catch(() => {});
        }
      } catch {}
    }

    async function sendText(message) {
      if (!message || send.disabled) return;
      let shown = message;
      if (replyLang === "ne" && hasLatin(message)) {
        shown = await toUnicoder(message);
      }
      addMember(shown);
      send.disabled = true;
      mic.disabled = true;
      showLoading();
      try {
        const res = await fetch("/v1/support/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: shown, conversation_id: conversationId, locale: replyLang })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : res.statusText);
        conversationId = data.conversation_id;
        if (data.transliterated && lastMemberBubble) lastMemberBubble.textContent = data.transliterated;
        clearLoading();
        addAgent(data.reply, false, data);
      } catch (err) {
        clearLoading();
        addAgent(String(err.message || err), true);
      } finally {
        send.disabled = false;
        mic.disabled = false;
        box.focus();
      }
    }

    function listen() {
      const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Rec) { addAgent(t().micErr, true); return; }
      const rec = new Rec();
      rec.lang = replyLang === "ne" ? "ne-NP" : "en-US";
      rec.interimResults = false;
      rec.onresult = (event) => {
        const text = event.results[0][0].transcript;
        if (text) sendText(text);
      };
      rec.onerror = () => addAgent(t().hearErr, true);
      rec.start();
      mic.classList.add("hot");
      rec.onend = () => mic.classList.remove("hot");
    }

    mic.addEventListener("click", listen);
    box.addEventListener("input", scheduleUnicoder);
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const converted = await convertComposer(true);
      const message = (converted || box.value).trim();
      box.value = "";
      paintUnicoderHint();
      sendText(message);
    });

    paintChrome();
    showWelcome();
  </script>
</body>
</html>
