<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>भाषा · डेसबोर्ड</title>
  <meta name="theme-color" id="theme-color" content="#f4fbf8" />
  <link rel="icon" href="/static/cloudfrm-logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("bhasa-theme");
        /* Dark is the designed look: the visual brief specifies one room —
           deep green / near-black with gold reserved for two things — and no
           light-mode palette has been designed against those contrast rules.
           An officer's own choice still wins; only the default changed. */
        var dark = saved ? saved === "dark" : true;
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {}
    })();
  </script>
  <style>
    /* ------------------------------------------------------------------
       Theme — Material 3 tokens taken from cloudfrm.ai (light + .dark).
       ------------------------------------------------------------------ */
    :root {
      color-scheme: light;
      --md-sys-color-primary: #006a60;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #74f8e5;
      --md-sys-color-on-primary-container: #00201c;
      --md-sys-color-secondary: #4a635f;
      --md-sys-color-secondary-container: #cce8e2;
      --md-sys-color-on-secondary-container: #05201c;
      --md-sys-color-tertiary: #456179;
      --md-sys-color-error: #ba1a1a;
      --md-sys-color-on-error: #ffffff;
      --md-sys-color-error-container: #ffdad6;
      --md-sys-color-on-error-container: #410002;
      --md-sys-color-background: #f4fbf8;
      --md-sys-color-on-background: #161d1b;
      --md-sys-color-surface: #f4fbf8;
      --md-sys-color-on-surface: #161d1b;
      --md-sys-color-on-surface-variant: #3f4947;
      --md-sys-color-outline: #6f7977;
      --md-sys-color-outline-variant: #bec9c6;
      --md-sys-color-surface-container-lowest: #ffffff;
      --md-sys-color-surface-container-low: #eff5f2;
      --md-sys-color-surface-container: #e9efec;
      --md-sys-color-surface-container-high: #e3eae7;
      --md-sys-color-surface-container-highest: #dde4e1;
      --shadow-card: 0 12px 32px rgba(22, 29, 27, 0.08);
      --shadow-bar: 0 -10px 28px rgba(22, 29, 27, 0.08);
    }
    html.dark {
      color-scheme: dark;
      --md-sys-color-primary: #53dbc9;
      --md-sys-color-on-primary: #003731;
      --md-sys-color-primary-container: #005048;
      --md-sys-color-on-primary-container: #74f8e5;
      --md-sys-color-secondary: #b1ccc6;
      --md-sys-color-secondary-container: #334b47;
      --md-sys-color-on-secondary-container: #cce8e2;
      --md-sys-color-tertiary: #adcae5;
      --md-sys-color-error: #ffb4ab;
      --md-sys-color-on-error: #690005;
      --md-sys-color-error-container: #93000a;
      --md-sys-color-on-error-container: #ffdad6;
      --md-sys-color-background: #0e1513;
      --md-sys-color-on-background: #dde4e1;
      --md-sys-color-surface: #0e1513;
      --md-sys-color-on-surface: #dde4e1;
      --md-sys-color-on-surface-variant: #bec9c6;
      --md-sys-color-outline: #899391;
      --md-sys-color-outline-variant: #3f4947;
      --md-sys-color-surface-container-lowest: #090f0e;
      --md-sys-color-surface-container-low: #161d1b;
      --md-sys-color-surface-container: #1a2120;
      --md-sys-color-surface-container-high: #252b2a;
      --md-sys-color-surface-container-highest: #303635;
      --shadow-card: 0 18px 44px rgba(0, 0, 0, 0.42);
      --shadow-bar: 0 -12px 32px rgba(0, 0, 0, 0.35);
    }
    :root {
      /* semantic aliases used by the layout */
      --bg: var(--md-sys-color-background);
      --ink: var(--md-sys-color-on-surface);
      --muted: var(--md-sys-color-on-surface-variant);
      --line: var(--md-sys-color-outline-variant);
      --line-soft: color-mix(in srgb, var(--md-sys-color-outline-variant) 55%, transparent);
      --panel: var(--md-sys-color-surface-container-low);
      --panel-2: var(--md-sys-color-surface-container);
      --panel-3: var(--md-sys-color-surface-container-high);
      --panel-4: var(--md-sys-color-surface-container-highest);
      --well: var(--md-sys-color-surface-container-lowest);
      --primary: var(--md-sys-color-primary);
      --on-primary: var(--md-sys-color-on-primary);
      --primary-soft: var(--md-sys-color-primary-container);
      --on-primary-soft: var(--md-sys-color-on-primary-container);
      --accent-soft: var(--md-sys-color-secondary-container);
      --on-accent-soft: var(--md-sys-color-on-secondary-container);
      --danger: var(--md-sys-color-error);
      --on-danger: var(--md-sys-color-on-error);
      --danger-soft: var(--md-sys-color-error-container);
      --on-danger-soft: var(--md-sys-color-on-error-container);
      --primary-12: color-mix(in srgb, var(--md-sys-color-primary) 12%, transparent);
      --primary-30: color-mix(in srgb, var(--md-sys-color-primary) 30%, transparent);
      --primary-45: color-mix(in srgb, var(--md-sys-color-primary) 45%, transparent);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; width: 100%; margin: 0; }
    body {
      color: var(--ink);
      font-family: "Noto Sans Devanagari", "Segoe UI", Roboto, system-ui, sans-serif;
      background:
        radial-gradient(900px 520px at 88% -12%, var(--primary-12), transparent 62%),
        var(--bg);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    /* ------------------------------------------------------------------
       Shell: left menu + main card
       ------------------------------------------------------------------ */
    .app {
      position: relative;
      z-index: 1;
      height: 100vh;
      width: 100%;
      display: grid;
      grid-template-columns: 248px 1fr;
      gap: 14px;
      padding: 14px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line-soft);
      box-shadow: var(--shadow-card);
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      padding: 22px 16px;
      min-height: 0;
      border-radius: 24px;
    }
    .brand { display: flex; gap: 12px; align-items: center; margin: 0 4px 26px; }
    .mark {
      width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
      display: block; object-fit: cover;
      background: #000005;
      border: 1px solid var(--line-soft);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
    }
    .brand h1 { margin: 0; font-size: 24px; font-weight: 700; line-height: 1.2; color: var(--ink); }
    .brand small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; line-height: 1.4; }
    .sidebar nav { display: flex; flex-direction: column; gap: 4px; }
    .sidebar nav button {
      text-align: left;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      font-size: 15px;
      padding: 11px 14px;
      border-radius: 14px;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
    }
    .sidebar nav button:hover { background: var(--panel-3); color: var(--ink); }
    .sidebar nav button.active {
      background: var(--accent-soft);
      color: var(--on-accent-soft);
      border-color: transparent;
    }
    .sidebar .grow { flex: 1; }
    .lang-switch { display: flex; gap: 6px; }
    .pill {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 999px;
      padding: 7px 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background .15s, border-color .15s, color .15s;
    }
    .pill:hover { background: var(--panel-3); }
    .pill.active {
      background: var(--primary);
      color: var(--on-primary);
      border-color: var(--primary);
    }
    .pill svg { display: block; }
    html.dark .pill .i-moon, html:not(.dark) .pill .i-sun { display: none; }
    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      border-radius: 24px;
      overflow: hidden;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 14px 24px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--line-soft);
      flex-shrink: 0;
    }
    .topbar h2 { margin: 0; font-size: 19px; font-weight: 700; color: var(--ink); }
    .status { display: flex; align-items: center; gap: 8px; color: var(--primary); font-weight: 600; font-size: 13px; margin-top: 2px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 8px var(--primary-45); }
    .dot.busy { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .stage { flex: 1; min-height: 0; display: grid; background: var(--bg); }
    .stage.home, .stage.settings { grid-template-columns: 1fr; }
    .stage.work { grid-template-columns: 300px 1fr; }

    /* ------------------------------------------------------------------
       Home / Settings
       ------------------------------------------------------------------ */
    .home, .settings { padding: 36px 40px; overflow: auto; }
    .home h2, .settings h2 { margin: 0 0 8px; font-size: 28px; font-weight: 700; }
    .lede, .settings p { margin: 0; color: var(--muted); line-height: 1.6; max-width: 640px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin: 28px 0;
    }
    .stat, .door {
      background: var(--panel-2);
      border: 1px solid var(--line-soft);
      border-radius: 20px;
      padding: 20px;
      transition: transform .2s, border-color .2s, background .2s;
    }
    .stat span, .door span { display: block; color: var(--muted); font-size: 13px; font-weight: 600; }
    .stat strong { display: block; font-size: 32px; margin-top: 8px; font-weight: 700; color: var(--primary); }
    .doors { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .door { cursor: pointer; text-align: left; color: inherit; width: 100%; }
    .door:hover { border-color: var(--primary); background: var(--panel-3); transform: translateY(-2px); }
    .door h3 { margin: 8px 0 6px; font-size: 22px; font-weight: 700; }
    .door p { margin: 0; color: var(--muted); line-height: 1.6; }

    /* ------------------------------------------------------------------
       Call (inbox + stage)
       ------------------------------------------------------------------ */
    .inbox {
      background: var(--panel);
      border-right: 1px solid var(--line-soft);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .inbox header {
      padding: 16px 16px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .inbox h3 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
    .inbox .new {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 999px;
      padding: 5px 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .inbox .new:hover { background: var(--panel-3); }
    .inbox .list { overflow: auto; flex: 1; padding: 0 10px 12px; }
    .thread {
      width: 100%; text-align: left; border: 1px solid transparent; background: transparent;
      border-radius: 12px; padding: 10px; cursor: pointer; color: inherit;
    }
    .thread:hover, .thread.on { background: var(--panel-3); border-color: var(--line-soft); }
    .thread .meta { font-size: 11px; color: var(--muted); font-weight: 600; }
    .thread .preview {
      margin-top: 4px; font-size: 13px; line-height: 1.6;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .tickets h4 { margin: 0 0 8px; font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
    .ticket { font-size: 13px; color: var(--muted); padding: 4px 0; }
    .desk { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
    #log, #call-log { flex: 1; overflow: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .call-stage { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .ring {
      margin: 36px auto 0; width: 168px; height: 168px; border-radius: 50%;
      display: grid; place-items: center;
      background: var(--panel-3);
      border: 6px solid var(--primary-45);
      font-size: 42px; font-weight: 700; color: var(--primary);
      box-shadow: 0 0 40px var(--primary-12);
    }
    .ring.live { border-color: var(--danger); box-shadow: 0 0 0 10px color-mix(in srgb, var(--danger) 18%, transparent); }
    .call-copy { text-align: center; margin: 16px 24px 0; }
    .call-copy h3 { margin: 0 0 6px; font-size: 24px; font-weight: 700; }
    .call-copy p { margin: 0; color: var(--muted); }
    .call-actions { display: flex; justify-content: center; gap: 10px; padding: 18px; }
    .call-actions button {
      border: 0; border-radius: 14px; padding: 12px 16px; font-weight: 700; cursor: pointer;
    }
    #pickup { background: var(--primary); color: var(--on-primary); min-width: 180px; }
    #hangup { background: var(--danger); color: var(--on-danger); min-width: 140px; }
    .empty { color: var(--muted); font-size: 13px; padding: 8px; }
    button:disabled { opacity: .55; }
    .hidden { display: none !important; }

    /* ------------------------------------------------------------------
       Message turns (shared by Chat and Call)
       ------------------------------------------------------------------ */
    .turn { display: flex; flex-direction: column; gap: 6px; max-width: 720px; }
    .turn.member { align-self: flex-end; align-items: flex-end; }
    .who { font-size: 12px; color: var(--muted); font-weight: 600; }
    .bubble {
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.75;
      white-space: pre-wrap;
      font-size: 15px;
      color: var(--ink);
    }
    .agent .bubble { background: var(--panel-3); border: 1px solid var(--line-soft); border-top-left-radius: 6px; }
    .member .bubble {
      background: var(--accent-soft);
      color: var(--on-accent-soft);
      border: 1px solid var(--primary-30);
      border-top-right-radius: 6px;
    }
    .err .bubble { background: var(--danger-soft); border-color: var(--danger); color: var(--on-danger-soft); }
    .play { border: 0; background: transparent; color: var(--primary); font-size: 13px; font-weight: 600; cursor: pointer; padding: 0 4px; }
    .loading { color: var(--muted); display: flex; align-items: center; gap: 10px; }
    .dots { display: inline-flex; gap: 4px; }
    .dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); animation: bounce 1s infinite ease-in-out; }
    .dots span:nth-child(2) { animation-delay: .15s; }
    .dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: .35; }
      40% { transform: translateY(-5px); opacity: 1; }
    }
    .unicoder { min-height: 22px; margin-top: 8px; color: var(--primary); font-weight: 600; font-size: 15px; line-height: 1.6; }
    .unicoder.idle { color: var(--muted); font-weight: 500; font-size: 13px; }

    /* ------------------------------------------------------------------
       Chat room — three zones: inbox (left) · conversation (middle) ·
       write bar (planted at the bottom of the conversation).
       ------------------------------------------------------------------ */
    .stage.chat-room { grid-template-columns: minmax(280px, 26%) minmax(0, 1fr); }

    /* Zone 1 — inbox */
    .chat-inbox {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      background: var(--panel);
      border-right: 1px solid var(--line-soft);
      position: relative;
      z-index: 1;
    }
    .chat-inbox__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 14px 12px 16px;
      border-bottom: 1px solid var(--line-soft);
      flex-shrink: 0;
    }
    .chat-inbox__head h3 { margin: 0; min-width: 0; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; color: var(--ink); }
    .chat-inbox__head h3 > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-inbox__head .chat-inbox__new { flex-shrink: 0; }
    .chat-inbox__count {
      min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px;
      background: var(--panel-4); color: var(--muted);
      font-size: 12px; font-weight: 700; display: inline-grid; place-items: center;
    }
    .chat-inbox__new {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, border-color .15s;
    }
    .chat-inbox__new:hover { background: var(--panel-3); border-color: var(--primary); }
    .chat-inbox__list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      scrollbar-width: thin;
    }
    .chat-inbox__list .empty { padding: 22px 12px; text-align: center; line-height: 1.7; }
    .convo {
      position: relative;
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 12px;
      padding: 11px 12px 11px 18px;
      cursor: pointer;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex-shrink: 0;
      transition: background .15s, border-color .15s;
    }
    .convo::before {
      content: "";
      position: absolute;
      left: 7px; top: 13px; bottom: 13px; width: 3px;
      border-radius: 3px;
      background: transparent;
    }
    .convo:hover { background: var(--panel-3); }
    .convo.on { background: var(--panel-3); border-color: var(--line-soft); }
    .convo.on::before { background: var(--primary); }
    .convo__top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .convo__name { font-size: 13.5px; font-weight: 700; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .convo__time { font-size: 11.5px; color: var(--muted); font-weight: 600; flex-shrink: 0; }
    .convo__preview {
      font-size: 13.5px;
      line-height: 1.7;
      color: var(--ink);
      opacity: .85;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: anywhere;
    }
    .convo__meta { font-size: 11.5px; color: var(--muted); display: flex; gap: 6px; }
    .chat-inbox__foot {
      border-top: 1px solid var(--line-soft);
      padding: 10px 16px 12px;
      max-height: 34%;
      overflow: auto;
      flex-shrink: 0;
      background: var(--panel-2);
    }
    /* A failed load has to read as a problem, not as "nothing here". The
       empty state is quiet grey; this is not. */
    .load-error {
      color: var(--danger);
      text-align: center;
      padding: 18px 12px;
      line-height: 1.6;
    }
    .load-error__line { font-weight: 600; }
    /* Any failed list, not just Chat's — the Call pane uses the same badge. */
    [data-state="error"] .chat-inbox__count {
      background: var(--danger-soft);
      color: var(--on-danger-soft);
    }
    .chat-inbox__foot .ticket { color: var(--ink); padding: 5px 0; line-height: 1.5; border-bottom: 1px solid var(--line-soft); }
    .chat-inbox__foot .ticket:last-child { border-bottom: 0; }
    .chat-inbox__foot .empty { padding: 4px 0; }

    /* Zone 2 — conversation */
    .room {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      background: var(--bg);
    }
    .room__head {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 13px 24px;
      border-bottom: 1px solid var(--line-soft);
      background: var(--panel);
    }
    .room__title { margin: 0; font-size: 16px; font-weight: 700; color: var(--ink); }
    .room__sub { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.6; }
    .room__tag {
      flex-shrink: 0;
      font-size: 12px; font-weight: 700; color: var(--primary);
      border: 1px solid var(--primary-45); border-radius: 999px;
      padding: 4px 11px; background: var(--primary-12);
      white-space: nowrap;
    }
    .room #log {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 22px 28px 18px;
      gap: 16px;
      scrollbar-width: thin;
    }
    .room .turn { max-width: min(720px, 84%); }
    .room .turn.agent { align-items: flex-start; }
    .room .who { font-size: 11.5px; padding: 0 4px; }
    .room .welcome {
      background: var(--panel-2);
      border: 1px solid var(--line-soft);
      border-radius: 16px;
      margin: 6px 0 0;
      max-width: 560px;
      padding: 20px 22px;
      flex-shrink: 0;
    }
    .room .welcome h2 { margin: 0 0 6px; font-size: 22px; line-height: 1.4; font-weight: 700; }
    .room .welcome p { margin: 0; color: var(--muted); line-height: 1.75; }

    /* Zone 3 — write bar */
    .desk-bar {
      flex-shrink: 0;
      background: var(--panel-2);
      border-top: 1px solid var(--line-soft);
      box-shadow: var(--shadow-bar);
      padding: 10px 20px 12px;
      position: relative;

      min-width: 0;
      min-height: 52px;
      max-height: 168px;

      color: var(--on-primary);

    @media (prefers-reduced-motion: reduce) {
      .door, .convo, .pill { transition: none; }
    }

      body { overflow: auto; }

       fetches and two ticket fetches. Concurrent callers for the same URL now
       share one request instead of each starting their own. */
    const inflightGets = new Map();
    function getJSON(url) {
      if (inflightGets.has(url)) return inflightGets.get(url);
      const pending = fetch(url)
        .then((res) => res.json())
        .finally(() => { inflightGets.delete(url); });
      inflightGets.set(url, pending);
      return pending;
    }

    /* Same de-duplication, but keeps the total the server reports. The list
       is one page; the badge has to state the whole desk. */
    const inflightPages = new Map();
    function getPage(url) {
      if (inflightPages.has(url)) return inflightPages.get(url);
      const pending = fetch(url)
        .then(async (res) => {
          const rows = await res.json();
          const header = res.headers.get("X-Total-Count");
          const total = header === null ? null : Number(header);
          return { rows: Array.isArray(rows) ? rows : [], total };
        })
        .finally(() => { inflightPages.delete(url); });
      inflightPages.set(url, pending);
      return pending;
    }

      document.documentElement.classList.toggle("dark", dark);
      document.documentElement.style.colorScheme = dark ? "dark" : "light";

    function paintUnicoderHint(preview) {
      if (replyLang !== "ne") {
        unicoderHint.textContent = t().unicoderHint;
        unicoderHint.className = "unicoder idle";
        if (preview && preview !== box.value) {
          unicoderHint.className = "unicoder";
          unicoderHint.textContent = t().unicoderLabel + preview;
        }
        return;
      }
      if (preview && preview !== box.value) {
        unicoderHint.className = "unicoder";
        unicoderHint.textContent = t().unicoderLabel + preview;
        return;
      }
      unicoderHint.className = "unicoder idle";
      unicoderHint.textContent = t().unicoderHint;
    }

    const NE_DIGITS = ["०", "१", "२", "३", "४", "५", "६", "७", "८", "९"];
    function neNum(value) {
      return String(value).replace(/[0-9]/g, (d) => NE_DIGITS[Number(d)]);
    }
    function localNum(value) {
      return replyLang === "ne" ? neNum(value) : String(value);
    }

    /* The single time formatter for the whole app.
       toLocaleDateString("ne-NP", {month:"short"}) silently falls back to
       English month names in the browser, which is how a raw "Aug 26" was
       appearing while the UI was in Nepali. Older dates are therefore
       formatted by hand as AD YYYY-MM-DD with localized numerals. */
    function fmtWhen(iso) {
      const stamp = iso || "";
      if (!stamp) return "";
      const d = new Date(stamp);
      if (isNaN(d.getTime())) return "";
      const now = new Date();
      const mins = Math.floor((now.getTime() - d.getTime()) / 60000);
      const c = t();
      if (mins < 1) return c.timeNow;
      if (mins < 60) return c.timeMinutes.replace("{n}", localNum(mins));
      if (d.toDateString() === now.toDateString()) return c.timeToday;
      if (d.toDateString() === new Date(now.getTime() - 86400000).toDateString()) return c.timeYesterday;
      const pad = (n) => String(n).padStart(2, "0");
      return localNum(`${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`);
    }

    function paintRoomHead() {
      const c = t();
      const titleEl = document.getElementById("room-title");
      const subEl = document.getElementById("room-sub");
      if (!chatId) {
        titleEl.textContent = c.roomNew;
        subEl.textContent = c.roomNewSub;
        return;
      }
      const turns = log.querySelectorAll(".turn:not(#pending)").length;
      const meta = convoMeta[chatId] || {};
      let sub = turns + " " + c.roomMsgs;
      if (meta.created_at) sub += " · " + c.roomSince + " " + fmtWhen(meta.created_at);
      titleEl.textContent = c.roomThread + " " + chatId.slice(0, 8).toUpperCase();
      subEl.textContent = sub;
    }

    function growBox() {
      box.style.height = "auto";
      box.style.height = Math.min(box.scrollHeight, 168) + "px";
    }

    /* A broken or slow transliterator must never become a broken send: every
       failure path returns the roman exactly as typed. */
    async function toUnicoder(text, signal) {
      const raw = text || "";
      if (!raw || !hasLatin(raw)) return raw;
      try {
        const res = await fetch("/v1/support/unicoder", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: raw }),
          signal
        });
        const data = await res.json();
        return (res.ok && data.nepali) ? data.nepali : raw;
      } catch {
        return raw;
      }
    }

    /* The preview the officer is currently looking at, and the exact roman
       that produced it. Sending reuses this instead of asking the endpoint to
       convert the same string a second and third time. */
    let previewSource = "";
    let previewValue = "";

    async function resolveOutgoing(text) {
      const raw = (text || "").trim();
      if (replyLang !== "ne" || !hasLatin(raw)) return raw;
      if (previewSource === raw && previewValue) return previewValue;
      return await toUnicoder(raw);
    }


    /* Live preview only. The textarea keeps exactly what the officer typed —
       the old code rewrote box.value mid-typing, which moved the cursor to
       the end of the line on every conversion. */
    async function updatePreview() {
      const typed = box.value;
      if (replyLang !== "ne" || !hasLatin(typed)) {
        previewSource = "";
        previewValue = "";
        paintUnicoderHint();
        return;
      }
      const seq = ++unicoderSeq;
      if (unicoderAbort) unicoderAbort.abort();
      unicoderAbort = new AbortController();
      const converted = await toUnicoder(typed, unicoderAbort.signal);
      // A slower earlier response must never overwrite a newer preview.
      if (seq !== unicoderSeq) return;
      previewSource = typed;
      previewValue = converted;
      paintUnicoderHint(converted);
    }

    function schedulePreview() {
      clearTimeout(previewTimer);
      previewTimer = setTimeout(() => {
        if (!isComposing) updatePreview();
      }, 120);
    }

    function showWelcome() {
      log.innerHTML = "";
      const el = document.createElement("div");
      el.className = "welcome";
      el.innerHTML = "<h2>" + t().welcomeTitle + "</h2><p>" + t().welcomeBody + "</p>";
      log.appendChild(el);
      started = false;
      chatId = null;
      paintRoomHead();
    }

    function addTurn(host, role, text, isErr) {
      if (host === log && !started) { host.innerHTML = ""; started = true; }
      const wrap = document.createElement("div");
      wrap.className = "turn " + (role === "user" || role === "member" ? "member" : "agent") + (isErr ? " err" : "");
      wrap.innerHTML = '<div class="who">' + (wrap.classList.contains("member") ? t().member : t().agent) + "</div>";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      wrap.appendChild(bubble);
      host.appendChild(wrap);
      host.scrollTop = host.scrollHeight;
      return bubble;
    }

    function addAgent(text, isErr, meta) {
      const bubble = addTurn(log, "agent", text, isErr);
      if (meta && meta.tickets && meta.tickets.length) {
        const note = document.createElement("div");
        note.className = "who";
        note.textContent = t().ticketPrefix + meta.tickets.join(", ");
        bubble.parentNode.appendChild(note);
      }
      if (!isErr) {
        const play = document.createElement("button");
        play.type = "button";
        play.className = "play";
        play.textContent = t().play;
        play.dataset.speech = text;
        play.addEventListener("click", () => togglePlayback(play, text));
        bubble.parentNode.appendChild(play);
        /* Auto-narration now only happens when the officer has switched the
           Voice toggle on, and that toggle defaults to off. It used to fetch
           a full MP3 for every reply whether or not anyone was listening. */
        if (speakOn) speakReply(text, false);
      }
    }

    /* Labels painted once at creation time kept the locale they were born
       in, so a bubble already on screen still read "Listen" after the
       officer switched to Nepali. Speaker names and the Listen/Stop control
       are chrome and follow the switch; message bodies deliberately do not. */
    function paintTurnLabels() {
      const c = t();
      document.querySelectorAll("#log .turn, #call-log .turn").forEach((turn) => {
        const who = turn.querySelector(".who");
        if (who && !turn.querySelector(".ticket-note, .who + .who")) {
          who.textContent = turn.classList.contains("member") ? c.member : c.agent;
        }
        const play = turn.querySelector(".play");
        if (play) setPlayLabel(play, play.dataset.playing === "true");
      });
    }

    function showLoading(host) {
      const el = document.createElement("div");
      el.className = "turn agent";
      el.id = host === callLog ? "call-pending" : "pending";
      el.innerHTML = '<div class="who">' + t().agent + '</div><div class="bubble loading"><span class="dots"><span></span><span></span><span></span></span></div>';
      host.appendChild(el);
      host.scrollTop = host.scrollHeight;
    }

    function clearLoading(id) {
      const pending = document.getElementById(id);
      if (pending) pending.remove();
    }

    /* ------------------------------------------------------------------
       Playback. One controller owns the audio, so there is a single place
       that can stop it.
       Before this, the only pause() in the app ran as a side effect of
       starting the next clip, behind a full round trip to /speak — so the
       closest thing to a stop was "press Listen again and wait a second
       for it to restart". Stopping now never waits on the network.
       ------------------------------------------------------------------ */
    let currentAudio = null;
    let currentPlayBtn = null;
    const speechCache = new WeakMap();   // play button -> data URL, so a
                                         // replay costs no second TTS call

    function setPlayLabel(btn, playing) {
      if (!btn) return;
      btn.textContent = playing ? t().stopPlay : t().play;
      btn.setAttribute("aria-pressed", playing ? "true" : "false");
      btn.dataset.playing = playing ? "true" : "false";
    }

    /* Synchronous on purpose: a stop must be instant. */
    function stopPlayback() {
      const audio = currentAudio;
      currentAudio = null;
      const btn = currentPlayBtn;
      currentPlayBtn = null;
      setPlayLabel(btn, false);
      if (audio) {
        try { audio.pause(); } catch (e) {}
      }
      if (lastAudio === audio) lastAudio = null;
    }

    function playSrc(src, btn) {
      stopPlayback();
      const audio = new Audio(src);
      currentAudio = audio;
      currentPlayBtn = btn || null;
      lastAudio = audio;
      const finished = () => {
        if (currentAudio === audio) {
          currentAudio = null;
          currentPlayBtn = null;
        }
        setPlayLabel(btn, false);
      };
      audio.addEventListener("ended", finished);
      audio.addEventListener("pause", finished);
      audio.addEventListener("error", finished);
      setPlayLabel(btn, true);
      const started = audio.play().catch(() => { finished(); });
      return { audio, started };
    }

    async function fetchSpeech(text) {
      const res = await fetch("/v1/support/speak", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, locale: replyLang })
      });
      const data = await res.json();
      if (!res.ok || !data.audio_base64) return null;
      return "data:" + (data.mime || "audio/mpeg") + ";base64," + data.audio_base64;
    }

    /* The Listen control is a toggle. While this bubble is speaking it reads
       रोक्नुहोस् / Stop, and pressing it silences the reply immediately. */
    async function togglePlayback(btn, text) {
      if (currentPlayBtn === btn && currentAudio) {
        stopPlayback();
        return;
      }
      stopPlayback();
      let src = speechCache.get(btn);
      if (!src) {
        btn.disabled = true;
        try {
          src = await fetchSpeech(text);
        } catch {
          src = null;
        }
        btn.disabled = false;
        if (!src) return;
        speechCache.set(btn, src);
      }
      playSrc(src, btn);
    }

    async function speakReply(text, wait) {
      if (!text) return;
      if (!wait && !speakOn) return;
      try {
        const src = await fetchSpeech(text);
        if (!src) return;
        const { audio, started } = playSrc(src, null);
        if (wait) {
          await new Promise((resolve) => {
            audio.addEventListener("ended", resolve);
            audio.addEventListener("pause", resolve);
            audio.addEventListener("error", resolve);
          });
        }
        await started;
      } catch {}
    }

    async function playPayload(data) {
      if (!data || !data.audio_base64) return;
      const src = "data:" + (data.mime || "audio/mpeg") + ";base64," + data.audio_base64;
      const { audio } = playSrc(src, null);
      await new Promise((resolve) => {
        audio.addEventListener("ended", resolve);
        audio.addEventListener("pause", resolve);
        audio.addEventListener("error", resolve);
      });
    }

    function newClientId() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    }

    /* One in-flight send at a time. The guard has to be set synchronously:
       the old code awaited transliteration before disabling Send, so two
       fast chip clicks both passed the check and created two conversations. */
    function setSendBusy(busy) {
      sendBusy = busy;
      send.disabled = busy;
      mic.disabled = busy;
      document.querySelectorAll("#chips button").forEach((btn) => { btn.disabled = busy; });
    }

    /* The busy flag only covers a send that is still in flight. Clicking a
       chip three times sent it twice: the second click landed after the first
       had completed, so it appended a duplicate question to the thread.
       Nobody clicks a fixed sentence twice inside a second on purpose. */
    const REPEAT_WINDOW_MS = 1500;
    let lastSentText = "";
    let lastSentAt = 0;

    async function sendText(message) {
      if (!message || sendBusy) return;
      const now = Date.now();
      if (message === lastSentText && now - lastSentAt < REPEAT_WINDOW_MS) return;
      lastSentText = message;
      lastSentAt = now;
      setSendBusy(true);
      /* Generated once for this message and reused if it is ever retried, so
         the server can recognise a duplicate and return the first result. */
      const clientId = newClientId();
      let shown = message;
      try {
        /* Only Nepali mode transliterates, and only if this text has not
           already been resolved from the preview. English-mode messages were
           being converted to Devanagari against the officer's intent. */
        if (replyLang === "ne" && hasLatin(message)) shown = await resolveOutgoing(message);
        lastMemberBubble = addTurn(log, "member", shown);
        showLoading(log);
        const res = await fetch("/v1/support/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Idempotency-Key": clientId },
          body: JSON.stringify({
            message: shown,
            conversation_id: chatId,
            locale: replyLang,
            channel: "chat",
            client_id: clientId
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : res.statusText);
        chatId = data.conversation_id;
        if (data.transliterated && lastMemberBubble) lastMemberBubble.textContent = data.transliterated;
        clearLoading("pending");
        addAgent(data.reply, false, data);
        paintRoomHead();
        /* Update the row we already know about instead of re-fetching every
           list: one send used to trigger five full refetches. */
        touchConversation(chatId, shown);
        if (data.tickets && data.tickets.length) loadTickets();
      } catch (err) {
        clearLoading("pending");
        addAgent(String(err.message || err), true);
      } finally {
        setSendBusy(false);
        box.focus();
      }
    }

    /* Move a conversation to the top of the local list with its new preview,
       creating the row if this was the first message. */
    function touchConversation(id, preview) {
      if (!id) return;
      const now = new Date().toISOString();
      const existing = conversations.find((row) => row.id === id);
      if (existing) {
        existing.preview = preview;
        existing.updated_at = now;
        existing.message_count = (existing.message_count || 0) + 2;
      } else {
        conversations.unshift({
          id,
          preview,
          updated_at: now,
          created_at: now,
          message_count: 2,
          locale: replyLang
        });
        conversationTotal += 1;
      }
      conversations.sort((a, b) => String(b.updated_at || "").localeCompare(String(a.updated_at || "")));
      paintChatInbox(conversations);
    }

    function listenChat() {
      const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Rec) { addAgent(t().micErr, true); return; }
      const rec = new Rec();
      rec.lang = replyLang === "ne" ? "ne-NP" : "en-US";
      rec.interimResults = false;
      rec.onresult = (event) => {
        const text = event.results[0][0].transcript;
        if (text) sendText(text);
      };
      rec.onerror = () => addAgent(t().hearErr, true);
      rec.start();
      mic.classList.add("hot");
      rec.onend = () => mic.classList.remove("hot");
    }

    /* A failed load must never look like an empty inbox. It used to throw,
       leaving the sidebar showing "0" and no rows — indistinguishable from a
       desk that genuinely has no conversations.
       The count is the part that lies loudest, so it shows a dash rather than
       asserting zero, and the message is announced, not just drawn. */
    function paintInboxError() {
      const countEl = document.getElementById("chat-inbox-count");
      paintListFailure({
        pane: document.getElementById("chat-inbox"),
        count: countEl,
        heading: countEl && countEl.closest("h3"),
        list: document.getElementById("chat-list"),
        name: t().chatInbox,
        onRetry: () => loadInbox("chat")
      });
    }

    function paintCallInboxError() {
      paintListFailure({
        pane: document.getElementById("inbox-pane"),
        count: document.getElementById("inbox-count"),
        heading: document.getElementById("inbox-title"),
        list: document.getElementById("inbox-list"),
        name: t().call,
        onRetry: () => loadInbox("call")
      });
    }

    function clearInboxError() {
      const pane = document.getElementById("chat-inbox");
      if (pane) delete pane.dataset.state;
    }

    /* One silent retry first. A single-worker server, a restart, or a relay
       hiccup all present as one dropped request, and recovering from that
       without showing the officer anything is better than making them press a
       button. Only a second failure is worth their attention. */
    async function getListWithRetry(url, fetcher) {
      const get = fetcher || getJSON;
      try {
        return await get(url);
      } catch (first) {
        await new Promise((resolve) => setTimeout(resolve, 400));
        return await get(url);
      }
    }

    /* One paging implementation, used by every list.
       This bug had four separate instances — the sidebar badge, two Dashboard
       tiles, and the Call inbox — because each surface counted and paged for
       itself. Anything that lists rows now shares this, so a list cannot
       quietly cap itself again. */
    function pagedSource(url, pageSize) {
      return { url, pageSize, rows: [], total: 0, exhausted: false, loading: false };
    }

    async function loadFirstPage(src) {
      const page = await getListWithRetry(
        src.url + "&limit=" + src.pageSize + "&offset=0", getPage
      );
      src.rows = page.rows;
      src.total = page.total === null ? page.rows.length : page.total;
      src.exhausted = src.rows.length >= src.total;
      return src;
    }

    /* Returns true when it actually appended, so a caller only repaints on a
       real change. Older rows load as the officer scrolls; before this,
       anything past the first page was simply unreachable. */
    async function loadNextPage(src) {
      if (src.loading || src.exhausted) return false;
      src.loading = true;
      try {
        const page = await getPage(
          src.url + "&limit=" + src.pageSize + "&offset=" + src.rows.length
        );
        if (page.total !== null) src.total = page.total;
        const known = new Set(src.rows.map((row) => row.id));
        const fresh = page.rows.filter((row) => !known.has(row.id));
        if (!fresh.length) {
          src.exhausted = true;
          return false;
        }
        src.rows = src.rows.concat(fresh);
        src.exhausted = src.rows.length >= src.total;
        return true;
      } catch (err) {
        /* Leave what is already listed on screen; scrolling again retries
           rather than costing the officer the rows they had. */
        return false;
      } finally {
        src.loading = false;
      }
    }

    /* Marking a list as failed is one operation, not a checklist each
       surface reimplements. Call's branch had copied only half of it — the
       visible dash, but not the aria-hidden or the heading label — so a
       screen reader kept announcing the last good count during an outage.
       Both surfaces now go through here. */
    function paintListFailure(opts) {
      if (opts.pane) opts.pane.dataset.state = "error";
      if (opts.count) {
        opts.count.textContent = "—";
        opts.count.setAttribute("aria-hidden", "true");
      }
      if (opts.heading) {
        opts.heading.setAttribute("aria-label", opts.name + ": " + t().listFailed);
      }
      paintListError(opts.list, opts.onRetry);
    }

    /* A failed list is never rendered as an empty one, on any surface. */
    function paintListError(container, onRetry) {
      container.innerHTML = "";
      const box = document.createElement("div");
      box.className = "empty load-error";
      box.setAttribute("role", "status");
      box.setAttribute("aria-live", "polite");
      const line = document.createElement("div");
      line.className = "load-error__line";
      line.textContent = t().listFailed;
      const retry = document.createElement("button");
      retry.type = "button";
      retry.className = "new";
      retry.style.marginTop = "8px";
      retry.textContent = t().retry;
      retry.addEventListener("click", onRetry);
      box.append(line, retry);
      container.appendChild(box);
    }

    async function loadOlderConversations() {
      if (view !== "chat") return;
      if (await loadNextPage(chatList)) {
        conversations = chatList.rows;
        conversationTotal = chatList.total;
        inboxExhausted = chatList.exhausted;
        paintChatInbox(conversations);
      }
    }

    async function loadOlderCalls() {
      if (view !== "call") return;
      if (await loadNextPage(callList)) paintCallInbox();
    }

    /* The Call list renders into its own element and used to have its own
       fetch — no limit, no total, no way to reach anything past the server's
       default page, and no badge to make the gap visible. It now goes through
       the same paged source as Chat. */
    function paintCallInbox() {
      const list = document.getElementById("inbox-list");
      const countEl = document.getElementById("inbox-count");
      const pane = document.getElementById("inbox-pane");
      if (pane) delete pane.dataset.state;
      list.innerHTML = "";
      if (countEl) {
        countEl.textContent = localNum(Math.max(callList.rows.length, callList.total || 0));
        countEl.setAttribute("aria-hidden", "true");
        const heading = document.getElementById("inbox-title");
        if (heading) {
          heading.setAttribute(
            "aria-label",
            t().call + ": " + localNum(Math.max(callList.rows.length, callList.total || 0))
          );
        }
      }
      if (!callList.rows.length) {
        list.innerHTML = '<div class="empty">' + t().emptyInbox + "</div>";
        return;
      }
      callList.rows.forEach((row) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "thread" + (row.id === callId ? " on" : "");
        /* Was a raw ISO slice — the second time-formatting path FIX 6 asks
           to remove, so it goes through the one formatter too. */
        btn.innerHTML = '<div class="meta"></div><div class="preview"></div>';
        btn.querySelector(".meta").textContent = fmtWhen(row.updated_at || row.created_at);
        btn.querySelector(".preview").textContent = row.preview || row.id.slice(0, 8);
        btn.addEventListener("click", () => openThread(row.id, "call"));
        list.appendChild(btn);
      });
    }

    async function loadInbox(channel) {
      const kind = channel || (view === "call" ? "call" : "chat");
      if (kind === "chat") {
        try {
          await loadFirstPage(chatList);
        } catch (err) {
          paintInboxError();
          return;
        }
        clearInboxError();
        conversations = chatList.rows;
        conversationTotal = chatList.total;
        inboxExhausted = chatList.exhausted;
        paintChatInbox(conversations);
        return;
      }
      try {
        await loadFirstPage(callList);
      } catch (err) {
        paintCallInboxError();
        return;
      }
      paintCallInbox();
    }

    function paintChatInbox(rows) {
      const c = t();
      const list = document.getElementById("chat-list");
      /* Recomputed from the live list on every render, so the badge follows
         new conversations instead of freezing at the page-load value.
         The badge is the visual count and is hidden from assistive tech; the
         heading carries the whole name instead. Labelling both made a screen
         reader announce "संवादहरू" and then "२८ संवादहरू" back to back. */
      const countEl = document.getElementById("chat-inbox-count");
      /* The badge counts the desk, not this page. It read one higher than the
         list because a newly sent conversation was added locally on top of a
         server page that was already truncated. */
      const shown = Math.max(rows.length, conversationTotal || 0);
      countEl.textContent = localNum(shown);
      countEl.setAttribute("aria-hidden", "true");
      const heading = countEl.closest("h3");
      if (heading) heading.setAttribute("aria-label", c.chatInbox + ": " + localNum(shown));
      list.innerHTML = "";
      convoMeta = {};
      rows.forEach((row) => { convoMeta[row.id] = row; });
      if (!rows.length) {
        list.innerHTML = '<div class="empty">' + c.emptyInbox + "</div>";
        paintRoomHead();
        return;
      }
      rows.forEach((row) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "convo" + (row.id === chatId ? " on" : "");
        btn.innerHTML =
          '<div class="convo__top"><span class="convo__name"></span><span class="convo__time"></span></div>' +
          '<div class="convo__preview"></div>' +
          '<div class="convo__meta"><span class="convo__count"></span></div>';
        btn.querySelector(".convo__name").textContent = c.memberRow + " · " + row.id.slice(0, 8).toUpperCase();
        /* Fall back to created_at so a row without updated_at still shows a
           time, rather than the blank label most rows were showing. */
        btn.querySelector(".convo__time").textContent = fmtWhen(row.updated_at || row.created_at);
        btn.querySelector(".convo__preview").textContent = row.preview || "—";
        btn.querySelector(".convo__count").textContent =
          localNum(row.message_count || 0) + " " + c.roomMsgs + (row.locale ? " · " + row.locale : "");
        btn.addEventListener("click", () => openThread(row.id, "chat"));
        list.appendChild(btn);
      });
      paintRoomHead();
    }

    async function openThread(id, kind) {
      const data = await getJSON("/v1/support/conversations/" + id);
      if (kind === "call") {
        callId = id;
        callLog.innerHTML = "";
        (data.messages || []).forEach((msg) => addTurn(callLog, msg.role, msg.content));
        /* Repaint to move the selection, like Chat does. Selecting a row is
           local state and was re-fetching the whole call list. */
        paintCallInbox();
        return;
      }
      chatId = id;
      started = true;
      log.innerHTML = "";
      (data.messages || []).forEach((msg) => addTurn(log, msg.role === "user" ? "member" : "agent", msg.content));
      paintRoomHead();
      /* Selecting a row is local state, not a reason to re-fetch the list. */
      paintChatInbox(conversations);
      box.focus();
    }

    async function loadTickets() {
      let rows;
      try {
        /* Ask the server for open tickets rather than filtering a page that
           was already truncated — the block only shows 8, but it must be the
           8 newest open ones, not whichever open ones survived the cap. */
        rows = await getListWithRetry("/v1/support/tickets?status=open&limit=8&offset=0");
      } catch (err) {
        const boxEl = document.getElementById("ticket-list");
        boxEl.innerHTML = "";
        const line = document.createElement("div");
        line.className = "empty load-error";
        line.setAttribute("role", "status");
        line.textContent = t().listFailed;
        const retry = document.createElement("button");
        retry.type = "button";
        retry.className = "new";
        retry.style.marginTop = "6px";
        retry.textContent = t().retry;
        retry.addEventListener("click", loadTickets);
        boxEl.append(line, retry);
        return 0;
      }
      const boxEl = document.getElementById("ticket-list");
      boxEl.innerHTML = "";
      const open = Array.isArray(rows) ? rows : [];
      if (!open.length) {
        boxEl.innerHTML = '<div class="empty">' + t().emptyTickets + "</div>";
        return open.length;
      }
      open.slice(0, 8).forEach((row) => {
        const el = document.createElement("div");
        el.className = "ticket";
        el.textContent = (row.id || "") + " · " + (row.subject || row.status);
        boxEl.appendChild(el);
      });
      return open.length;
    }

    /* These tiles are counts, so they must come from the count the server
       reports — never from the length of a page. Asking for one row and
       reading X-Total-Count keeps them right no matter how large the desk
       grows, and stops the tiles plateauing at the page size the way the
       sidebar badge used to. */
    async function statTotal(url) {
      const page = await getPage(url + "&limit=1&offset=0");
      return page.total === null ? page.rows.length : page.total;
    }

    /* Kept as numbers, formatted at paint time, so switching language
       re-renders them in the right numerals without another round trip. */
    let homeStats = { chat: 0, call: 0, ticket: 0 };

    function paintStats() {
      document.getElementById("stat-chat").textContent = localNum(homeStats.chat);
      document.getElementById("stat-call").textContent = localNum(homeStats.call);
      document.getElementById("stat-ticket").textContent = localNum(homeStats.ticket);
    }

    async function loadHome() {
      try {
        const [chats, calls, openTickets] = await Promise.all([
          statTotal("/v1/support/conversations?channel=chat"),
          statTotal("/v1/support/conversations?channel=call"),
          statTotal("/v1/support/tickets?status=open")
        ]);
        homeStats = { chat: chats, call: calls, ticket: openTickets };
        paintStats();
      } catch {}
    }

    function setCallUi(on) {
      callLive = on;
      document.getElementById("ring").classList.toggle("live", on);
      document.getElementById("status-dot").classList.toggle("busy", on);
      document.getElementById("live").textContent = on ? t().liveOn : t().liveIdle;
      document.getElementById("pickup").classList.toggle("hidden", on);
      document.getElementById("hangup").classList.toggle("hidden", !on);
    }

    async function pickup() {
      if (callLive) return;
      setCallUi(true);
      callLog.innerHTML = "";
      showLoading(callLog);
      try {
        const res = await fetch("/v1/support/calls/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ locale: replyLang })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : res.statusText);
        callId = data.conversation_id;
        clearLoading("call-pending");
        addTurn(callLog, "agent", data.reply);
        loadInbox("call");
        loadHome();
        await playPayload(data);
        if (callLive) listenCall();
      } catch (err) {
        clearLoading("call-pending");
        addTurn(callLog, "agent", String(err.message || err), true);
        setCallUi(false);
      }
    }

    function hangup() {
      callLive = false;
      callBusy = false;
      if (callRec) { try { callRec.stop(); } catch {} callRec = null; }
      if (lastAudio) { lastAudio.pause(); lastAudio = null; }
      setCallUi(false);
      loadInbox("call");
    }

    function listenCall() {
      if (!callLive || callBusy) return;
      const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Rec) { addTurn(callLog, "agent", t().micErr, true); return; }
      const rec = new Rec();
      callRec = rec;
      rec.lang = replyLang === "ne" ? "ne-NP" : "en-US";
      rec.interimResults = false;
      rec.onresult = async (event) => {
        const text = event.results[0][0].transcript;
        if (!text || !callLive) return;
        callBusy = true;
        try { rec.stop(); } catch {}
        await sendCallTurn(text);
        callBusy = false;
        if (callLive) listenCall();
      };
      rec.onerror = () => {
        if (callLive && !callBusy) addTurn(callLog, "agent", t().hearErr, true);
      };
      rec.onend = () => {
        callRec = null;
        if (callLive && !callBusy) setTimeout(() => { if (callLive && !callBusy) listenCall(); }, 500);
      };
      try { rec.start(); } catch {}
    }

    async function sendCallTurn(message) {
      let shown = message;
      if (hasLatin(message)) shown = await toUnicoder(message);
      addTurn(callLog, "member", shown);
      showLoading(callLog);
      try {
        const res = await fetch("/v1/support/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: shown, conversation_id: callId, locale: replyLang, channel: "call" })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : res.statusText);
        callId = data.conversation_id;
        clearLoading("call-pending");
        addTurn(callLog, "agent", data.reply);
        loadInbox("call");
        await speakReply(data.reply, true);
      } catch (err) {
        clearLoading("call-pending");
        addTurn(callLog, "agent", String(err.message || err), true);
      }
    }

    document.querySelectorAll(".sidebar nav button").forEach((btn) => {
      btn.addEventListener("click", () => setView(btn.getAttribute("data-view")));
    });
    document.querySelectorAll(".door").forEach((btn) => {
      btn.addEventListener("click", () => setView(btn.getAttribute("data-go")));
    });
    document.getElementById("lang-ne").addEventListener("click", () => {
      replyLang = "ne";
      localStorage.setItem("bhasa-lang", "ne");
      paintChrome();
      if (view === "chat") loadInbox("chat");
    });
    document.getElementById("lang-en").addEventListener("click", () => {
      replyLang = "en";
      localStorage.setItem("bhasa-lang", "en");
      paintChrome();
      if (view === "chat") loadInbox("chat");
    });
    document.getElementById("speak-toggle").addEventListener("click", () => {
      speakOn = !speakOn;
      localStorage.setItem("bhasa-speak", speakOn ? "on" : "off");
      /* Switching narration off silences what is being read right now.
         It used to only govern future replies, so an officer who turned
         Voice off mid-sentence kept listening to the sentence. */
      if (!speakOn) stopPlayback();
      paintChrome();
    });
    themeToggle.addEventListener("click", () => setTheme(!isDark()));
    try {
      /* No OS-theme following: it would pull an officer who has not chosen a
         theme back into light mode, which is the look nobody designed. */
    } catch (e) {}
    document.getElementById("new-thread").addEventListener("click", () => {
      if (view === "call") { hangup(); callId = null; callLog.innerHTML = ""; }
      else showWelcome();
      loadInbox();
    });
    document.getElementById("chat-new").addEventListener("click", () => {
      showWelcome();
      loadInbox("chat");
      box.focus();
    });
    mic.addEventListener("click", listenChat);
    /* While a Nepali keyboard is mid-composition, do not convert and do not
       send — Enter would otherwise fire on a half-formed syllable. */
    box.addEventListener("compositionstart", () => { isComposing = true; });
    box.addEventListener("compositionend", () => {
      isComposing = false;
      schedulePreview();
    });
    box.addEventListener("input", () => {
      growBox();
      if (!isComposing) schedulePreview();
    });
    box.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" || event.shiftKey) return;
      if (isComposing || event.isComposing || event.keyCode === 229) return;
      event.preventDefault();
      if (typeof form.requestSubmit === "function") form.requestSubmit();
      else form.dispatchEvent(new Event("submit", { cancelable: true }));
    });
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (sendBusy || isComposing) return;
      const typed = box.value.trim();
      if (!typed) return;
      // Reuses the preview already on screen when it matches, so sending does
      // not convert the same text again.
      const message = (await resolveOutgoing(typed)) || typed;
      box.value = "";
      previewSource = "";
      previewValue = "";
      growBox();
      paintUnicoderHint();
      sendText(message);
    });
    document.getElementById("chat-list").addEventListener("scroll", (event) => {
      const el = event.currentTarget;
      if (el.scrollHeight - el.scrollTop - el.clientHeight < 160) loadOlderConversations();
    });
    document.getElementById("inbox-list").addEventListener("scroll", (event) => {
      const el = event.currentTarget;
      if (el.scrollHeight - el.scrollTop - el.clientHeight < 160) loadOlderCalls();
    });
    document.getElementById("pickup").addEventListener("click", pickup);
    document.getElementById("hangup").addEventListener("click", hangup);

    setView("home");
  </script>
</body>
</html>
