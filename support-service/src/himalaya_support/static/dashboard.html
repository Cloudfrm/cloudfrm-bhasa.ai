<!doctype html>
<html lang="ne">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>bhasa · अधिकृत डेस्क</title>
  <meta id="theme-color" name="theme-color" content="#f4fbf8" />
  <link rel="icon" href="/static/cloudfrm-logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("bhasa-theme");
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {}
    })();
  </script>
  <style>
    /* Material 3 tokens from cloudfrm.ai (light + .dark) */
    :root {
      color-scheme: light;
      --md-sys-color-primary: #006a60; --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #74f8e5; --md-sys-color-on-primary-container: #00201c;
      --md-sys-color-secondary-container: #cce8e2; --md-sys-color-on-secondary-container: #05201c;
      --md-sys-color-error: #ba1a1a; --md-sys-color-on-error: #ffffff;
      --md-sys-color-error-container: #ffdad6; --md-sys-color-on-error-container: #410002;
      --md-sys-color-background: #f4fbf8; --md-sys-color-on-surface: #161d1b;
      --md-sys-color-on-surface-variant: #3f4947; --md-sys-color-outline: #6f7977;
      --md-sys-color-outline-variant: #bec9c6;
      --md-sys-color-surface-container-lowest: #ffffff; --md-sys-color-surface-container-low: #eff5f2;
      --md-sys-color-surface-container: #e9efec; --md-sys-color-surface-container-high: #e3eae7;
      --md-sys-color-surface-container-highest: #dde4e1;
      --shadow-card: 0 12px 32px rgba(22, 29, 27, 0.08);
    }
    html.dark {
      color-scheme: dark;
      --md-sys-color-primary: #53dbc9; --md-sys-color-on-primary: #003731;
      --md-sys-color-primary-container: #005048; --md-sys-color-on-primary-container: #74f8e5;
      --md-sys-color-secondary-container: #334b47; --md-sys-color-on-secondary-container: #cce8e2;
      --md-sys-color-error: #ffb4ab; --md-sys-color-on-error: #690005;
      --md-sys-color-error-container: #93000a; --md-sys-color-on-error-container: #ffdad6;
      --md-sys-color-background: #0e1513; --md-sys-color-on-surface: #dde4e1;
      --md-sys-color-on-surface-variant: #bec9c6; --md-sys-color-outline: #899391;
      --md-sys-color-outline-variant: #3f4947;
      --md-sys-color-surface-container-lowest: #090f0e; --md-sys-color-surface-container-low: #161d1b;
      --md-sys-color-surface-container: #1a2120; --md-sys-color-surface-container-high: #252b2a;
      --md-sys-color-surface-container-highest: #303635;
      --shadow-card: 0 18px 44px rgba(0, 0, 0, 0.42);
    }
    :root {
      --bg: var(--md-sys-color-background); --ink: var(--md-sys-color-on-surface);
      --muted: var(--md-sys-color-on-surface-variant); --line: var(--md-sys-color-outline-variant);
      --line-soft: color-mix(in srgb, var(--md-sys-color-outline-variant) 55%, transparent);
      --panel: var(--md-sys-color-surface-container-low); --panel-2: var(--md-sys-color-surface-container);
      --panel-3: var(--md-sys-color-surface-container-high); --panel-4: var(--md-sys-color-surface-container-highest);
      --well: var(--md-sys-color-surface-container-lowest);
      --primary: var(--md-sys-color-primary); --on-primary: var(--md-sys-color-on-primary);
      --primary-soft: var(--md-sys-color-primary-container); --on-primary-soft: var(--md-sys-color-on-primary-container);
      --accent-soft: var(--md-sys-color-secondary-container); --on-accent-soft: var(--md-sys-color-on-secondary-container);
      --danger: var(--md-sys-color-error); --danger-soft: var(--md-sys-color-error-container); --on-danger-soft: var(--md-sys-color-on-error-container);
      --primary-12: color-mix(in srgb, var(--md-sys-color-primary) 12%, transparent);
      --primary-30: color-mix(in srgb, var(--md-sys-color-primary) 30%, transparent);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; width: 100%; margin: 0; }
    body {
      color: var(--ink);
      font-family: "Noto Sans Devanagari", "Segoe UI", Roboto, system-ui, sans-serif;
      font-weight: 400; /* Devanagari is never set lighter than regular (E12) */
      background: radial-gradient(900px 520px at 88% -12%, var(--primary-12), transparent 62%), var(--bg);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      line-height: 1.8;
    }
    /* E12: Devanagari 1.8, Latin 1.6 */
    :lang(ne), [lang="ne"] { line-height: 1.8; }
    :lang(en), [lang="en"] { line-height: 1.6; }
    button { font: inherit; line-height: inherit; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .hidden { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* Shell */
    .app { position: relative; z-index: 1; display: grid; grid-template-columns: 248px minmax(0, 1fr); gap: 14px; height: 100vh; padding: 14px; }
    .card { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 22px; box-shadow: var(--shadow-card); }
    .sidebar { display: flex; flex-direction: column; padding: 18px 14px; gap: 10px; min-width: 0; }
    .brand { display: flex; gap: 12px; align-items: center; padding: 4px 6px 14px; }
    .brand .mark { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line-soft); background: #090f0e; object-fit: cover; }
    .brand h1 { margin: 0; font-size: 24px; font-weight: 700; line-height: 1.2; color: var(--ink); font-family: "Segoe UI", Roboto, system-ui, sans-serif; letter-spacing: 0.01em; }
    .brand small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; line-height: 1.4; }
    .sidebar nav { display: flex; flex-direction: column; gap: 4px; }
    .sidebar nav button { text-align: start; padding: 11px 14px; border-radius: 12px; border: 1px solid transparent; background: transparent; color: var(--ink); cursor: pointer; }
    .sidebar nav button.active { background: var(--accent-soft); color: var(--on-accent-soft); font-weight: 600; border-color: var(--line-soft); }
    .sidebar .grow { flex: 1; }
    /* E18: one language control, unambiguous active state (check glyph + weight + fill + aria-checked) */
    .lang-group { display: flex; flex-direction: column; gap: 6px; padding: 10px 6px 4px; border-top: 1px solid var(--line-soft); }
    .lang-group__label { font-size: 12px; color: var(--muted); }
    .lang-group__opts { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--well); }
    .lang-group__opts button { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; border: 1px solid transparent; background: transparent; color: var(--ink); cursor: pointer; min-width: 92px; justify-content: center; }
    .lang-group__opts button .check { display: inline-block; width: 1em; font-weight: 700; }
    .lang-group__opts button.is-on { background: var(--primary); color: var(--on-primary); font-weight: 700; }

    .main { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; overflow: hidden; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 22px 12px; border-bottom: 1px solid var(--line-soft); }
    .topbar h2 { margin: 0; font-size: 18px; font-weight: 700; }
    .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
    .status .glyph { font-size: 11px; }
    .status[data-state="open"] .glyph { color: var(--primary); }
    .status[data-state="down"] { color: var(--danger); font-weight: 600; }
    .controls { display: flex; gap: 8px; align-items: center; }
    .pill, .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--well); color: var(--ink); cursor: pointer; }
    .btn { background: var(--primary); color: var(--on-primary); border-color: transparent; font-weight: 600; }
    .btn.ghost { background: var(--well); color: var(--ink); border-color: var(--line); font-weight: 500; }
    .btn.tiny { padding: 4px 10px; font-size: 12.5px; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .pill .i-moon { display: none; } html.dark .pill .i-sun { display: none; } html.dark .pill .i-moon { display: inline; }

    .stage { min-height: 0; overflow: hidden; }
    .stage.home, .stage.settings { overflow: auto; }
    .stage.chat-room { display: grid; grid-template-columns: 300px minmax(0, 1fr); }

    /* Home */
    .home, .settings { padding: 28px 30px; max-width: 980px; }
    .home h2, .settings h2 { margin: 0 0 6px; font-size: 26px; }
    .lede, .settings p { margin: 0; color: var(--muted); max-width: 680px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 22px 0; }
    .stat { background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 16px; padding: 14px 16px; }
    .stat span { font-size: 12.5px; color: var(--muted); }
    .stat strong { display: block; font-size: 30px; color: var(--primary); }
    .doors { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .door { text-align: start; background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 18px; padding: 18px; color: var(--ink); cursor: pointer; }
    .door.note { cursor: default; background: var(--panel); }
    .door span { font-size: 12px; color: var(--muted); }
    .door h3 { margin: 4px 0 6px; font-size: 18px; }
    .door p { margin: 0; color: var(--muted); }

    /* Inbox */
    .chat-inbox { border-right: 1px solid var(--line-soft); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; }
    .chat-inbox__head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line-soft); }
    .chat-inbox__head h3 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
    .chat-inbox__count { background: var(--panel-4); border-radius: 999px; padding: 1px 9px; font-size: 12px; }
    .chat-inbox__new { border: 1px solid var(--line); background: var(--well); border-radius: 10px; padding: 7px 10px; cursor: pointer; font-size: 13px; color: var(--ink); }
    .chat-inbox__list { overflow: auto; padding: 8px; }
    .convo { width: 100%; text-align: start; background: transparent; border: 1px solid transparent; border-radius: 14px; padding: 10px 12px; color: var(--ink); cursor: pointer; }
    .convo.on { background: var(--panel-2); border-color: var(--line-soft); }
    .convo__top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
    .convo__name { font-weight: 600; }
    .convo__time { color: var(--muted); }
    .convo__preview { color: var(--muted); font-size: 13px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .convo__meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .chat-inbox__foot { border-top: 1px solid var(--line-soft); padding: 10px 16px 14px; font-size: 13px; }
    .chat-inbox__foot h4 { margin: 0 0 4px; font-size: 13px; }
    .empty { color: var(--muted); padding: 18px 12px; text-align: center; }
    .ticket { padding: 5px 0; border-bottom: 1px solid var(--line-soft); }

    /* Thread (E20: setup header has a defined edge; the desk-bar has its own) */
    .room { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; min-height: 0; }
    .room__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 14px 20px 12px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
    .room__title { margin: 0; font-size: 16px; }
    .room__sub { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
    .room__tag { flex: none; align-self: center; font-size: 12px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--well); color: var(--muted); }
    #net-banner:empty { display: none; }
    .banner { display: flex; gap: 8px; align-items: center; padding: 10px 20px; background: var(--danger-soft); color: var(--on-danger-soft); border-bottom: 1px solid var(--line); font-size: 13.5px; }
    .banner__glyph { font-size: 15px; }
    #log { overflow: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
    .empty-thread { background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 18px; padding: 18px 20px; max-width: 640px; }
    .empty-thread h2 { margin: 0 0 6px; font-size: 20px; }
    .empty-thread p { margin: 0; color: var(--muted); }
    .turn { max-width: 720px; }
    .turn.member { align-self: flex-end; }
    .turn .who { font-size: 12px; color: var(--muted); margin: 0 6px 4px; }
    .turn.member .who { text-align: end; }
    .turn.member .bubble { background: var(--primary-soft); color: var(--on-primary-soft); border-radius: 16px 16px 4px 16px; padding: 10px 14px; white-space: pre-wrap; }
    .turn.member[data-state="pending"] .bubble { border: 1px dashed var(--primary-30); }
    /* Answer and refusal share one geometry. Refusal is a neutral surface. */
    .card.answer, .card.refusal, .card.error, .card.wait { border-radius: 4px 16px 16px 16px; padding: 12px 16px 14px; border: 1px solid var(--line-soft); box-shadow: none; }
    .card.answer { background: var(--well); }
    .card.refusal { background: var(--panel-2); }
    .card.wait { background: var(--panel-2); }
    .card.error { background: var(--danger-soft); color: var(--on-danger-soft); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }
    .card__label { display: flex; gap: 8px; align-items: center; font-size: 12.5px; font-weight: 600; color: var(--muted); }
    .card.error .card__label { color: inherit; }
    .card__glyph { font-size: 14px; }
    .card__note { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
    .card.error .card__note { color: inherit; }
    .passage { margin: 8px 0 0; padding: 0 0 0 12px; border-left: 3px solid var(--primary-30); white-space: pre-wrap; font-size: 15.5px; }
    .passage.frozen { border-left-color: var(--line); }
    .card__meta { margin-top: 8px; font-size: 12px; color: var(--muted); }
    .card__actions { margin-top: 10px; display: flex; gap: 8px; }
    .status-line { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13.5px; padding: 4px 6px; }
    .status-line[data-state="searching-long"] { color: var(--ink); }

    /* Composer zone — one deliberate stack (E19):
       topics · candidate strip → input → helper row → credential rule + send row */
    .desk-bar { border-top: 1px solid var(--line); background: var(--panel-2); padding: 12px 20px 14px; display: grid; gap: 10px; }
    .desk-bar__topics { display: grid; gap: 6px; padding-bottom: 10px; border-bottom: 1px solid var(--line-soft); }
    .desk-bar__topics-label { font-size: 12px; color: var(--muted); }
    #chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { border: 1px solid var(--line); background: var(--well); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--ink); cursor: pointer; }
    .chips__none { font-size: 13px; color: var(--muted); }
    .composer { display: grid; gap: 8px; }
    .ime { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--well); min-height: 44px; align-items: center; }
    .ime[hidden] { display: none; }
    .ime__opt { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--ink); cursor: pointer; font-size: 15px; }
    .ime__opt kbd { font: 600 11px/1 "Segoe UI", system-ui, sans-serif; background: var(--panel-4); border-radius: 6px; padding: 3px 6px; }
    .ime__opt.is-active { background: var(--accent-soft); color: var(--on-accent-soft); border-color: var(--line-soft); font-weight: 600; }
    .ime__opt.is-raw span { font-family: "Segoe UI", system-ui, sans-serif; }
    .ime__opt small { color: var(--muted); font-size: 11px; }
    .composer__input { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: end; }
    #box { width: 100%; resize: none; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--well); color: var(--ink); font: inherit; line-height: 1.8; min-height: 48px; max-height: 168px; }
    .composer__helper { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 12.5px; color: var(--muted); padding: 0 4px; }
    .ime-toggle { border: 1px solid var(--line); background: var(--well); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; color: var(--ink); cursor: pointer; }
    .ime-toggle.on { background: var(--accent-soft); color: var(--on-accent-soft); border-color: transparent; font-weight: 600; }
    #composer-notice:empty { display: none; }
    .composer-notice { display: flex; gap: 8px; align-items: flex-start; padding: 8px 12px; border-radius: 12px; font-size: 13.5px; border: 1px solid var(--line-soft); }
    .composer-notice.warn { background: var(--panel-4); color: var(--ink); }
    .composer-notice.error { background: var(--danger-soft); color: var(--on-danger-soft); }
    .composer-notice.info { background: var(--panel-3); color: var(--ink); }
    .composer__send { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 8px; border-top: 1px solid var(--line-soft); }
    .cred-rule { display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
    #send { padding: 10px 22px; border-radius: 12px; min-width: 130px; }

    /* Settings */
    .caps { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 14px 0 22px; font-size: 14px; }
    .caps dt { color: var(--muted); }
    .caps dd { margin: 0; }
    .settings h3 { margin: 18px 0 4px; font-size: 16px; }
    .settings ul { margin: 8px 0 0; padding-left: 20px; color: var(--muted); font-size: 14px; }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    @media (max-width: 960px) {
      body { overflow: auto; }
      .app { grid-template-columns: 1fr; height: auto; min-height: 100vh; }
      .sidebar { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px; }
      .brand { padding: 0; }
      .sidebar nav { flex-direction: row; flex-wrap: wrap; }
      .sidebar .grow { display: none; }
      .lang-group { border-top: 0; border-left: 1px solid var(--line-soft); padding: 0 0 0 12px; margin-left: auto; }
      .stage.chat-room { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
      .chat-inbox { max-height: 240px; border-right: 0; border-bottom: 1px solid var(--line-soft); }
      .chat-inbox__foot { display: none; }
      .room { min-height: 70vh; }
      .stats, .doors { grid-template-columns: 1fr; }
      .home, .settings { padding: 20px 16px; }
    }
  </style>
</head>
<body>
  <div class="sr-only" id="announce" aria-live="polite" aria-atomic="true"></div>
  <div class="app" id="app">
    <aside class="sidebar card">
      <div class="brand">
        <img class="mark" src="/static/cloudfrm-logo.png" alt="CloudFRM logo" width="44" height="44" />
        <div>
          <h1 lang="en">bhasa</h1>
          <small id="brand-sub"></small>
        </div>
      </div>
      <nav aria-label="Sections">
        <button type="button" id="nav-home" class="active" data-view="home" aria-current="page"></button>
        <button type="button" id="nav-chat" data-view="chat"></button>
        <button type="button" id="nav-settings" data-view="settings"></button>
      </nav>
      <div class="grow"></div>
      <div class="lang-group" id="lang-group" role="radiogroup">
        <span class="lang-group__label" id="lang-group-label"></span>
        <div class="lang-group__opts">
          <button type="button" id="lang-ne" role="radio" aria-checked="true" lang="ne"><span class="check" aria-hidden="true"></span>नेपाली</button>
          <button type="button" id="lang-en" role="radio" aria-checked="false" lang="en"><span class="check" aria-hidden="true"></span>English</button>
        </div>
      </div>
    </aside>
    <div class="main card">
      <header class="topbar">
        <div>
          <h2 id="page-title"></h2>
          <div class="status" data-state="checking"><span class="glyph" id="status-glyph" aria-hidden="true">◌</span><span id="live"></span></div>
        </div>
        <div class="controls">
          <button type="button" id="theme-toggle" class="pill" aria-label="Toggle light and dark theme" aria-pressed="false">
            <svg class="i-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="i-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <span id="theme-label"></span>
          </button>
        </div>
      </header>
      <div class="stage home" id="stage">
        <section class="home" id="view-home">
          <h2 id="home-title"></h2>
          <p class="lede" id="home-lede"></p>
          <div class="stats">
            <div class="stat"><span id="stat-chat-label"></span><strong id="stat-chat">०</strong></div>
            <div class="stat"><span id="stat-ticket-label"></span><strong id="stat-ticket">०</strong></div>
            <div class="stat"><span id="stat-docs-label"></span><strong id="stat-docs">०</strong></div>
          </div>
          <div class="doors">
            <button type="button" class="door" data-go="chat">
              <span id="door-chat-kicker"></span>
              <h3 id="door-chat-title"></h3>
              <p id="door-chat-body"></p>
            </button>
            <div class="door note" id="door-voice">
              <span id="door-voice-kicker"></span>
              <h3 id="door-voice-title"></h3>
              <p id="door-voice-body"></p>
            </div>
          </div>
        </section>

        <aside class="chat-inbox hidden" id="chat-inbox" aria-label="Conversations">
          <div class="chat-inbox__head">
            <h3><span id="chat-inbox-title"></span><span class="chat-inbox__count" id="chat-inbox-count">०</span></h3>
            <button type="button" class="chat-inbox__new" id="chat-new"></button>
          </div>
          <div class="chat-inbox__list" id="chat-list"></div>
          <div class="chat-inbox__foot" id="ticket-box">
            <h4 id="tickets-label"></h4>
            <div id="ticket-list"></div>
          </div>
        </aside>

        <section class="room hidden" id="view-chat">
          <header class="room__head">
            <div>
              <h3 class="room__title" id="room-title"></h3>
              <p class="room__sub" id="room-sub"></p>
            </div>
            <span class="room__tag" id="room-tag"></span>
          </header>
          <div id="net-banner"></div>
          <div id="log" aria-live="off"></div>
          <div class="desk-bar">
            <div class="desk-bar__topics">
              <span class="desk-bar__topics-label" id="topics-label"></span>
              <div id="chips"></div>
            </div>
            <form id="form" class="composer">
              <div class="ime" id="ime-strip" hidden></div>
              <div class="composer__input">
                <textarea id="box" rows="1" autocomplete="off" spellcheck="false" aria-describedby="hint cred-rule"></textarea>
                <div id="voice-slot"></div>
              </div>
              <div class="composer__helper">
                <button type="button" class="ime-toggle" id="ime-toggle" aria-pressed="true"></button>
                <span id="hint"></span>
              </div>
              <div id="composer-notice"></div>
              <div class="composer__send">
                <span class="cred-rule"><span aria-hidden="true">🔒</span><span id="cred-rule"></span></span>
                <button id="send" type="submit" class="btn"></button>
              </div>
            </form>
          </div>
        </section>

        <section class="settings hidden" id="view-settings">
          <h2 id="settings-title"></h2>
          <p id="settings-body"></p>
          <h3 id="caps-title"></h3>
          <div id="caps-table"></div>
          <h3 id="rules-title"></h3>
          <ul id="rules-list"></ul>
        </section>
      </div>
    </div>
  </div>
  <script src="/static/desk-core.js"></script>
  <script src="/static/desk-ui.js"></script>
  <script src="/static/ime.js"></script>
  <script src="/static/desk.js"></script>
</body>
</html>
