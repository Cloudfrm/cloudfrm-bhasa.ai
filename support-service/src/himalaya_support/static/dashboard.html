<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>भाषा · डेसबोर्ड</title>
  <meta name="theme-color" id="theme-color" content="#f4fbf8" />
  <link rel="icon" href="/static/cloudfrm-logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("bhasa-theme");
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {}
    })();
  </script>
  <style>
    /* ------------------------------------------------------------------
       Theme — Material 3 tokens taken from cloudfrm.ai (light + .dark).
       ------------------------------------------------------------------ */
    :root {
      color-scheme: light;
      --md-sys-color-primary: #006a60;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #74f8e5;
      --md-sys-color-on-primary-container: #00201c;
      --md-sys-color-secondary: #4a635f;
      --md-sys-color-secondary-container: #cce8e2;
      --md-sys-color-on-secondary-container: #05201c;
      --md-sys-color-tertiary: #456179;
      --md-sys-color-error: #ba1a1a;
      --md-sys-color-on-error: #ffffff;
      --md-sys-color-error-container: #ffdad6;
      --md-sys-color-on-error-container: #410002;
      --md-sys-color-background: #f4fbf8;
      --md-sys-color-on-background: #161d1b;
      --md-sys-color-surface: #f4fbf8;
      --md-sys-color-on-surface: #161d1b;
      --md-sys-color-on-surface-variant: #3f4947;
      --md-sys-color-outline: #6f7977;
      --md-sys-color-outline-variant: #bec9c6;
      --md-sys-color-surface-container-lowest: #ffffff;
      --md-sys-color-surface-container-low: #eff5f2;
      --md-sys-color-surface-container: #e9efec;
      --md-sys-color-surface-container-high: #e3eae7;
      --md-sys-color-surface-container-highest: #dde4e1;
      --shadow-card: 0 12px 32px rgba(22, 29, 27, 0.08);
      --shadow-bar: 0 -10px 28px rgba(22, 29, 27, 0.08);
    }
    html.dark {
      color-scheme: dark;
      --md-sys-color-primary: #53dbc9;
      --md-sys-color-on-primary: #003731;
      --md-sys-color-primary-container: #005048;
      --md-sys-color-on-primary-container: #74f8e5;
      --md-sys-color-secondary: #b1ccc6;
      --md-sys-color-secondary-container: #334b47;
      --md-sys-color-on-secondary-container: #cce8e2;
      --md-sys-color-tertiary: #adcae5;
      --md-sys-color-error: #ffb4ab;
      --md-sys-color-on-error: #690005;
      --md-sys-color-error-container: #93000a;
      --md-sys-color-on-error-container: #ffdad6;
      --md-sys-color-background: #0e1513;
      --md-sys-color-on-background: #dde4e1;
      --md-sys-color-surface: #0e1513;
      --md-sys-color-on-surface: #dde4e1;
      --md-sys-color-on-surface-variant: #bec9c6;
      --md-sys-color-outline: #899391;
      --md-sys-color-outline-variant: #3f4947;
      --md-sys-color-surface-container-lowest: #090f0e;
      --md-sys-color-surface-container-low: #161d1b;
      --md-sys-color-surface-container: #1a2120;
      --md-sys-color-surface-container-high: #252b2a;
      --md-sys-color-surface-container-highest: #303635;
      --shadow-card: 0 18px 44px rgba(0, 0, 0, 0.42);
      --shadow-bar: 0 -12px 32px rgba(0, 0, 0, 0.35);
    }
    :root {
      /* semantic aliases used by the layout */
      --bg: var(--md-sys-color-background);
      --ink: var(--md-sys-color-on-surface);
      --muted: var(--md-sys-color-on-surface-variant);
      --line: var(--md-sys-color-outline-variant);
      --line-soft: color-mix(in srgb, var(--md-sys-color-outline-variant) 55%, transparent);
      --panel: var(--md-sys-color-surface-container-low);
      --panel-2: var(--md-sys-color-surface-container);
      --panel-3: var(--md-sys-color-surface-container-high);
      --panel-4: var(--md-sys-color-surface-container-highest);
      --well: var(--md-sys-color-surface-container-lowest);
      --primary: var(--md-sys-color-primary);
      --on-primary: var(--md-sys-color-on-primary);
      --primary-soft: var(--md-sys-color-primary-container);
      --on-primary-soft: var(--md-sys-color-on-primary-container);
      --accent-soft: var(--md-sys-color-secondary-container);
      --on-accent-soft: var(--md-sys-color-on-secondary-container);
      --danger: var(--md-sys-color-error);
      --on-danger: var(--md-sys-color-on-error);
      --danger-soft: var(--md-sys-color-error-container);
      --on-danger-soft: var(--md-sys-color-on-error-container);
      --primary-12: color-mix(in srgb, var(--md-sys-color-primary) 12%, transparent);
      --primary-30: color-mix(in srgb, var(--md-sys-color-primary) 30%, transparent);
      --primary-45: color-mix(in srgb, var(--md-sys-color-primary) 45%, transparent);
    }

    /* ------------------------------------------------------------------
       भाषा Chat tokens — the Chat room only. One room, one gold, one
       rhythm. Gold marks exactly two things: Send and the selected
       conversation. Dark is the canonical desk; light maps the same
       roles onto the brand's paper-green so the theme toggle holds.
       ------------------------------------------------------------------ */
    :root {
      --bhasa-room:        #E9F0EA;
      --bhasa-surface:     #F2F7F2;
      --bhasa-raised:      #FBFDFB;
      --bhasa-hover:       #E1EAE3;
      --bhasa-line:        #C2D1C6;
      --bhasa-line-soft:   #D8E2DA;
      --bhasa-gold:        #A8811A;
      --bhasa-gold-hover:  #8F6D13;
      --bhasa-gold-quiet:  rgba(168, 129, 26, 0.12);
      --bhasa-gold-edge:   rgba(168, 129, 26, 0.65);
      --bhasa-gold-ink:    #241B04;
      /* Send keeps the same gold in both themes; ink stays dark on it */
      --bhasa-gold-btn:       #C9A227;
      --bhasa-gold-btn-hover: #DDB63A;
      --bhasa-text:        #182420;
      --bhasa-text-muted:  #44594D;
      --bhasa-text-faint:  #7D9488;
      --bhasa-error:       #B3372A;
      --bhasa-error-bg:    rgba(179, 55, 42, 0.10);
      --bhasa-listening:   #B04A3C;
      --bhasa-member-bg:   rgba(201, 162, 39, 0.16);
      --bhasa-member-line: rgba(168, 129, 26, 0.38);
      --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-xl: 18px;
      /* spacing rhythm: 4 8 12 16 20 24 32 40 */
      --motion-fast: 120ms;
      --motion-base: 180ms;
      --motion-slow: 260ms;
      --ease-out: cubic-bezier(0.2, 0, 0, 1);
    }
    html.dark {
      --bhasa-room:        #0A130F;
      --bhasa-surface:     #101C16;
      --bhasa-raised:      #17271F;
      --bhasa-hover:       #1D3128;
      --bhasa-line:        #24382E;
      --bhasa-line-soft:   #1B2A22;
      --bhasa-gold:        #C9A227;
      --bhasa-gold-hover:  #DDB63A;
      --bhasa-gold-quiet:  rgba(201, 162, 39, 0.14);
      --bhasa-gold-edge:   rgba(201, 162, 39, 0.55);
      --bhasa-gold-ink:    #241B04;
      --bhasa-text:        #ECF2ED;
      --bhasa-text-muted:  #A9BEB2;
      --bhasa-text-faint:  #7D9488;
      --bhasa-error:       #E4776A;
      --bhasa-error-bg:    rgba(228, 119, 106, 0.12);
      --bhasa-listening:   #D06A5A;
      --bhasa-member-bg:   rgba(201, 162, 39, 0.16);
      --bhasa-member-line: rgba(201, 162, 39, 0.40);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; width: 100%; margin: 0; }
    body {
      color: var(--ink);
      font-family: "Noto Sans Devanagari", "Segoe UI", Roboto, system-ui, sans-serif;
      background:
        radial-gradient(900px 520px at 88% -12%, var(--primary-12), transparent 62%),
        var(--bg);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    /* ------------------------------------------------------------------
       Shell: left menu + main card
       ------------------------------------------------------------------ */
    .app {
      position: relative;
      z-index: 1;
      height: 100vh;
      width: 100%;
      display: grid;
      grid-template-columns: 248px 1fr;
      gap: 14px;
      padding: 14px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line-soft);
      box-shadow: var(--shadow-card);
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      padding: 22px 16px;
      min-height: 0;
      border-radius: 24px;
    }
    .brand { display: flex; gap: 12px; align-items: center; margin: 0 4px 26px; }
    .mark {
      width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
      display: block; object-fit: cover;
      background: #000005;
      border: 1px solid var(--line-soft);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
    }
    .brand h1 { margin: 0; font-size: 24px; font-weight: 700; line-height: 1.2; color: var(--ink); }
    .brand small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; line-height: 1.4; }
    .sidebar nav { display: flex; flex-direction: column; gap: 4px; }
    .sidebar nav button {
      text-align: left;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      font-size: 15px;
      padding: 11px 14px;
      border-radius: 14px;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
    }
    .sidebar nav button:hover { background: var(--panel-3); color: var(--ink); }
    .sidebar nav button.active {
      background: var(--accent-soft);
      color: var(--on-accent-soft);
      border-color: transparent;
    }
    .sidebar .grow { flex: 1; }
    .lang-switch { display: flex; gap: 6px; }
    .pill {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 999px;
      padding: 7px 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background .15s, border-color .15s, color .15s;
    }
    .pill:hover { background: var(--panel-3); }
    .pill.active {
      background: var(--primary);
      color: var(--on-primary);
      border-color: var(--primary);
    }
    .pill svg { display: block; }
    html.dark .pill .i-moon, html:not(.dark) .pill .i-sun { display: none; }
    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      border-radius: 24px;
      overflow: hidden;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 14px 24px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--line-soft);
      flex-shrink: 0;
    }
    .topbar h2 { margin: 0; font-size: 19px; font-weight: 700; color: var(--ink); }
    .status { display: flex; align-items: center; gap: 8px; color: var(--primary); font-weight: 600; font-size: 13px; margin-top: 2px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 8px var(--primary-45); }
    .dot.busy { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .stage { flex: 1; min-height: 0; display: grid; background: var(--bg); }
    .stage.home, .stage.settings { grid-template-columns: 1fr; }
    .stage.work { grid-template-columns: 300px 1fr; }

    /* ------------------------------------------------------------------
       Home / Settings
       ------------------------------------------------------------------ */
    .home, .settings { padding: 36px 40px; overflow: auto; }
    .home h2, .settings h2 { margin: 0 0 8px; font-size: 28px; font-weight: 700; }
    .lede, .settings p { margin: 0; color: var(--muted); line-height: 1.6; max-width: 640px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin: 28px 0;
    }
    .stat, .door {
      background: var(--panel-2);
      border: 1px solid var(--line-soft);
      border-radius: 20px;
      padding: 20px;
      transition: transform .2s, border-color .2s, background .2s;
    }
    .stat span, .door span { display: block; color: var(--muted); font-size: 13px; font-weight: 600; }
    .stat strong { display: block; font-size: 32px; margin-top: 8px; font-weight: 700; color: var(--primary); }
    .doors { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .door { cursor: pointer; text-align: left; color: inherit; width: 100%; }
    .door:hover { border-color: var(--primary); background: var(--panel-3); transform: translateY(-2px); }
    .door h3 { margin: 8px 0 6px; font-size: 22px; font-weight: 700; }
    .door p { margin: 0; color: var(--muted); line-height: 1.6; }

    /* ------------------------------------------------------------------
       Call (inbox + stage)
       ------------------------------------------------------------------ */
    .inbox {
      background: var(--panel);
      border-right: 1px solid var(--line-soft);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .inbox header {
      padding: 16px 16px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .inbox h3 { margin: 0; font-size: 15px; }
    .inbox .new {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 999px;
      padding: 5px 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .inbox .new:hover { background: var(--panel-3); }
    .inbox .list { overflow: auto; flex: 1; padding: 0 10px 12px; }
    .thread {
      width: 100%; text-align: left; border: 1px solid transparent; background: transparent;
      border-radius: 12px; padding: 10px; cursor: pointer; color: inherit;
    }
    .thread:hover, .thread.on { background: var(--panel-3); border-color: var(--line-soft); }
    .thread .meta { font-size: 11px; color: var(--muted); font-weight: 600; }
    .thread .preview {
      margin-top: 4px; font-size: 13px; line-height: 1.6;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .tickets h4 { margin: 0 0 8px; font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
    .ticket { font-size: 13px; color: var(--muted); padding: 4px 0; }
    .desk { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
    #log, #call-log { flex: 1; overflow: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .call-stage { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .ring {
      margin: 36px auto 0; width: 168px; height: 168px; border-radius: 50%;
      display: grid; place-items: center;
      background: var(--panel-3);
      border: 6px solid var(--primary-45);
      font-size: 42px; font-weight: 700; color: var(--primary);
      box-shadow: 0 0 40px var(--primary-12);
    }
    .ring.live { border-color: var(--danger); box-shadow: 0 0 0 10px color-mix(in srgb, var(--danger) 18%, transparent); }
    .call-copy { text-align: center; margin: 16px 24px 0; }
    .call-copy h3 { margin: 0 0 6px; font-size: 24px; font-weight: 700; }
    .call-copy p { margin: 0; color: var(--muted); }
    .call-actions { display: flex; justify-content: center; gap: 10px; padding: 18px; }
    .call-actions button {
      border: 0; border-radius: 14px; padding: 12px 16px; font-weight: 700; cursor: pointer;
    }
    #pickup { background: var(--primary); color: var(--on-primary); min-width: 180px; }
    #hangup { background: var(--danger); color: var(--on-danger); min-width: 140px; }
    .empty { color: var(--muted); font-size: 13px; padding: 8px; }
    button:disabled { opacity: .55; }
    .hidden { display: none !important; }

    /* ------------------------------------------------------------------
       Message turns (shared by Chat and Call)
       ------------------------------------------------------------------ */
    .turn { display: flex; flex-direction: column; gap: 6px; max-width: 720px; }
    .turn.member { align-self: flex-end; align-items: flex-end; }
    .who { font-size: 12px; color: var(--muted); font-weight: 600; }
    .bubble {
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.75;
      white-space: pre-wrap;
      font-size: 15px;
      color: var(--ink);
    }
    .agent .bubble { background: var(--panel-3); border: 1px solid var(--line-soft); border-top-left-radius: 6px; }
    .member .bubble {
      background: var(--accent-soft);
      color: var(--on-accent-soft);
      border: 1px solid var(--primary-30);
      border-top-right-radius: 6px;
    }
    .err .bubble { background: var(--danger-soft); border-color: var(--danger); color: var(--on-danger-soft); }
    .play { border: 0; background: transparent; color: var(--primary); font-size: 13px; font-weight: 600; cursor: pointer; padding: 0 4px; }
    .loading { color: var(--muted); display: flex; align-items: center; gap: 10px; }
    .dots { display: inline-flex; gap: 4px; }
    .dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); animation: bounce 1s infinite ease-in-out; }
    .dots span:nth-child(2) { animation-delay: .15s; }
    .dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: .35; }
      40% { transform: translateY(-5px); opacity: 1; }
    }
    .unicoder { min-height: 22px; margin-top: 8px; color: var(--primary); font-weight: 600; font-size: 15px; line-height: 1.6; }
    .unicoder.idle { color: var(--muted); font-weight: 500; font-size: 13px; }

    /* ------------------------------------------------------------------
       Chat room — three zones: inbox (left) · conversation (middle) ·
       write bar (planted at the bottom of the conversation).
       ------------------------------------------------------------------ */
    .stage.chat-room {
      grid-template-columns: clamp(288px, 25%, 360px) minmax(0, 1fr);
      background: var(--bhasa-room);
      color: var(--bhasa-text);
    }
    .stage.chat-room :focus-visible { outline: 2px solid var(--bhasa-gold-edge); outline-offset: 2px; }

    /* Zone 1 — inbox */
    .chat-inbox {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      background: var(--bhasa-surface);
      border-right: 1px solid var(--bhasa-line);
      position: relative;
      z-index: 1;
    }
    .chat-inbox__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 16px 12px;
      flex-shrink: 0;
    }
    .chat-inbox__head h3 { margin: 0; min-width: 0; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; color: var(--bhasa-text); }
    .chat-inbox__head h3 > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-inbox__count {
      min-width: 22px; height: 22px; padding: 0 7px; border-radius: var(--r-sm);
      background: var(--bhasa-raised); border: 1px solid var(--bhasa-line-soft);
      color: var(--bhasa-text-muted);
      font-size: 12px; font-weight: 700; display: inline-grid; place-items: center;
    }
    .chat-inbox__new {
      display: block;
      width: calc(100% - 32px);
      margin: 0 16px 12px;
      border: 1px solid var(--bhasa-line);
      background: var(--bhasa-raised);
      color: var(--bhasa-text);
      border-radius: var(--r-md);
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: background .15s, border-color .15s;
    }
    .chat-inbox__new:hover { background: var(--bhasa-hover); border-color: var(--bhasa-text-muted); }
    .chat-inbox__list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 4px 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scrollbar-width: thin;
      border-top: 1px solid var(--bhasa-line-soft);
    }
    .convo {
      position: relative;
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      background: transparent;
      border-radius: var(--r-md);
      padding: 10px 12px;
      cursor: pointer;
      color: var(--bhasa-text);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      column-gap: 8px;
      flex-shrink: 0;
      transition: background .15s, border-color .15s;
    }
    .convo:hover { background: var(--bhasa-hover); }
    .convo.on {
      background: var(--bhasa-gold-quiet);
      border-color: var(--bhasa-gold-edge);
    }
    .convo__time {
      grid-column: 2;
      grid-row: 1;
      align-self: start;
      font-size: 12px;
      color: var(--bhasa-text-muted);
      font-weight: 600;
      white-space: nowrap;
      padding-top: 2px;
    }
    .convo__preview {
      grid-column: 1;
      grid-row: 1 / span 2;
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--bhasa-text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: anywhere;
      min-height: calc(13.5px * 1.6 * 2);
    }
    .chat-inbox__empty {
      padding: 32px 20px;
      text-align: center;
    }
    .chat-inbox__empty strong {
      display: block;
      font-size: 14.5px;
      font-weight: 700;
      color: var(--bhasa-text);
      margin-bottom: 6px;
      line-height: 1.6;
    }
    .chat-inbox__empty span {
      display: block;
      font-size: 13px;
      color: var(--bhasa-text-muted);
      line-height: 1.7;
    }
    .chat-inbox__foot .empty { color: var(--bhasa-text-muted); }
    .chat-inbox__foot {
      border-top: 1px solid var(--bhasa-line);
      padding: 12px 16px;
      max-height: 34%;
      overflow: auto;
      flex-shrink: 0;
      background: var(--bhasa-surface);
    }
    /* Devanagari headings must never get uppercase or letter-spacing */
    .chat-inbox__foot h4 { color: var(--bhasa-text-muted); text-transform: none; letter-spacing: normal; font-size: 12px; font-weight: 700; }
    .chat-inbox__foot .ticket { color: var(--bhasa-text); font-size: 13px; padding: 5px 0; line-height: 1.6; border-bottom: 1px solid var(--bhasa-line-soft); }
    .chat-inbox__foot .ticket:last-child { border-bottom: 0; }
    .chat-inbox__foot .empty { padding: 4px 0; }

    /* Zone 2 — conversation */
    /* A0.5 — grid rows (chips · thread · composer). min-height:0 is the
       critical line: without it the thread never scrolls and the
       composer is pushed off-screen at long thread lengths. */
    .room {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      min-height: 0;
      min-width: 0;
      background: var(--bhasa-room);
      position: relative;
    }
    .room__topics {
      flex-shrink: 0;
      padding: 16px 28px 12px;
      border-bottom: 1px solid var(--bhasa-line-soft);
      background: var(--bhasa-room);
    }
    .room__topics-label {
      display: block;
      font-size: 12px; font-weight: 700; color: var(--bhasa-text-muted);
      margin-bottom: 8px;
    }
    #chips { display: flex; flex-wrap: wrap; gap: 8px; }
    #chips button {
      flex-shrink: 0;
      border: 1px solid var(--bhasa-line);
      background: var(--bhasa-raised);
      color: var(--bhasa-text);
      border-radius: var(--r-md);
      padding: 8px 14px;
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.6;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, border-color .15s;
    }
    #chips button:hover { background: var(--bhasa-hover); border-color: var(--bhasa-gold-edge); }
    .room #log {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 24px 28px 20px;
      gap: 16px;
      scrollbar-width: thin;
    }
    /* A0.5 corrects the main prompt's 68–72ch: `ch` derives from the
       width of "0" and reads far too narrow for Devanagari. */
    .room .turn,
    .room .welcome {
      width: 100%;
      max-width: 760px;
      margin-inline: auto;
      align-self: center;
    }
    .room .turn.agent { align-items: flex-start; }
    .room .turn.member + .turn.member,
    .room .turn.agent + .turn.agent { margin-top: -8px; }
    .room .bubble {
      max-width: min(78%, 640px);
      border-radius: var(--r-lg);
      line-height: 1.75;
      color: var(--bhasa-text);
      overflow-wrap: anywhere;
      word-break: break-word;
      animation: turn-enter var(--motion-base) var(--ease-out);
    }
    @keyframes turn-enter {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }
    .room .agent .bubble {
      background: var(--bhasa-raised);
      border: 1px solid var(--bhasa-line-soft);
      border-top-left-radius: var(--r-sm);
    }
    .room .member .bubble {
      background: var(--bhasa-member-bg);
      border: 1px solid var(--bhasa-member-line);
      color: var(--bhasa-text);
      border-top-right-radius: var(--r-sm);
    }
    .room .who { font-size: 11.5px; padding: 0 4px; color: var(--bhasa-text-muted); }
    /* WO9 — a failed send stays on the right and stays readable. The
       icon carries the meaning alongside the colour (WCAG 1.4.1). */
    .room .err .bubble {
      background: var(--bhasa-error-bg);
      border-color: var(--bhasa-error);
      color: var(--bhasa-text);
    }
    .fail-note {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 4px;
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--bhasa-error);
      font-weight: 600;
    }
    .fail-note__icon {
      width: 16px; height: 16px; flex-shrink: 0;
      border-radius: 50%;
      border: 1.5px solid currentColor;
      display: inline-grid; place-items: center;
      font-size: 11px; font-weight: 700;
    }
    .fail-note__retry {
      border: 0;
      background: transparent;
      color: var(--bhasa-text-muted);
      font: inherit;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
      padding: 4px;
      min-height: 32px;
    }
    .fail-note__retry:hover { color: var(--bhasa-text); }
    .room .writing .bubble { gap: 10px; }
    .writing__label { font-size: 13.5px; }
    .as-typed {
      border: 0; background: transparent;
      color: var(--bhasa-text-muted);
      font: inherit; font-size: 12.5px; font-weight: 600;
      text-decoration: underline; text-underline-offset: 3px;
      cursor: pointer; margin-left: 12px; padding: 2px 4px;
    }
    .as-typed.on { color: var(--bhasa-text); }
    .char-count { margin-left: 12px; color: var(--bhasa-text-muted); font-size: 12px; font-weight: 600; }
    .room .play {
      color: var(--bhasa-text-muted);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .room .play:hover { color: var(--bhasa-text); }
    .room .loading { color: var(--bhasa-text-muted); }
    .room .dots span { background: var(--bhasa-gold); }
    .room .welcome {
      background: var(--bhasa-surface);
      border: 1px solid var(--bhasa-line);
      border-radius: var(--r-xl);
      margin-top: 8px;
      padding: 24px;
      flex-shrink: 0;
      color: var(--bhasa-text);
    }
    .room .welcome h2 { margin: 0 0 8px; font-size: 22px; line-height: 1.5; font-weight: 700; color: var(--bhasa-text); }
    .room .welcome p { margin: 0; color: var(--bhasa-text-muted); line-height: 1.75; }

    /* Jump to latest — quiet, keyboard reachable, sits above the bar */
    .jump-latest {
      position: absolute;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      z-index: 3;
      border: 1px solid var(--bhasa-line);
      background: var(--bhasa-raised);
      color: var(--bhasa-text);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .18);
    }
    .jump-latest:hover { background: var(--bhasa-hover); }
    .jump-latest[hidden] { display: none; }

    /* A0.8 connection banner — a strip above the composer. Never a
       modal, never covering the inbox. */
    .conn-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 24px;
      border-top: 1px solid var(--bhasa-line);
      background: var(--bhasa-error-bg);
      color: var(--bhasa-error);
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.6;
    }
    .conn-banner[hidden] { display: none; }
    .conn-banner button {
      border: 1px solid currentColor;
      background: transparent;
      color: inherit;
      border-radius: var(--r-sm);
      padding: 5px 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Zone 3 — write bar */
    .desk-bar {
      flex-shrink: 0;
      background: var(--bhasa-surface);
      border-top: 1px solid var(--bhasa-line);
      padding: 14px 24px;
      position: relative;
      z-index: 1;
    }
    .desk-bar form { display: flex; align-items: flex-end; gap: 8px; }
    .desk-bar textarea {
      flex: 1;
      min-width: 0;
      min-height: 52px;
      max-height: 168px;
      resize: none;
      padding: 13px 16px;
      border-radius: var(--r-lg);
      border: 1px solid var(--bhasa-line);
      background: var(--bhasa-raised);
      color: var(--bhasa-text);
      caret-color: var(--bhasa-gold);
      font: inherit;
      font-size: 15px;
      line-height: 1.75;
      overflow-y: auto;
    }
    .desk-bar textarea::placeholder { color: var(--bhasa-text-muted); opacity: 1; }
    .desk-bar textarea:focus { outline: 2px solid var(--bhasa-gold-edge); outline-offset: 1px; border-color: var(--bhasa-gold); }
    .desk-bar #mic, .desk-bar #send {
      height: 52px;
      border-radius: var(--r-lg);
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 15px;
    }
    .desk-bar #mic {
      min-width: 52px;
      padding: 0 16px;
      background: var(--bhasa-raised);
      border: 1px solid var(--bhasa-line);
      color: var(--bhasa-text);
    }
    .desk-bar #mic:hover { background: var(--bhasa-hover); }
    .desk-bar #mic.hot { background: var(--bhasa-listening); color: #FFF6F2; border-color: var(--bhasa-listening); }
    .desk-bar #send {
      min-width: 136px;
      padding: 0 20px;
      border: 0;
      background: var(--bhasa-gold-btn);
      color: var(--bhasa-gold-ink);
    }
    .desk-bar #send:hover:not(:disabled) { background: var(--bhasa-gold-btn-hover); }
    .desk-bar #send:disabled { opacity: .45; cursor: default; }
    /* Height is reserved whether or not a preview is showing, so the
       composer never shifts when it appears (A0.6 rule 3). */
    .desk-bar .unicoder {
      min-height: 26px;
      margin-top: 8px;
      color: var(--bhasa-text);
      font-weight: 600;
      font-size: 15px;
      line-height: 1.6;
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
    }
    .desk-bar .unicoder.idle { color: var(--bhasa-text-muted); font-weight: 500; font-size: 13px; }
    .desk-bar .unicoder.err { color: var(--bhasa-error); font-weight: 600; font-size: 13.5px; }

    @media (prefers-reduced-motion: reduce) {
      .door, .convo, .pill { transition: none; }
      .stage.chat-room *,
      .stage.chat-room *::before,
      .stage.chat-room *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      /* A0.15 — the typing dots become a static line, not a freeze-frame */
      .room .dots span { opacity: 1; transform: none; }
    }
    @media (max-width: 960px) {
      body { overflow: auto; }
      .app { grid-template-columns: 1fr; height: auto; min-height: 100vh; }
      .sidebar { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px; }
      .brand { margin: 0; }
      .sidebar nav { flex-direction: row; flex-wrap: wrap; }
      .sidebar .grow { display: none; }
      .stage.work { grid-template-columns: 1fr; }
      .inbox { max-height: 180px; border-right: 0; border-bottom: 1px solid var(--line-soft); }
      .stats, .doors { grid-template-columns: 1fr; }
      .home, .settings { padding: 20px 16px; }
      .stage.chat-room { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
      .chat-inbox { max-height: 240px; border-right: 0; border-bottom: 1px solid var(--line-soft); }
      .chat-inbox__foot { display: none; }
      .room { min-height: 70vh; }
      .room #log { padding: 16px; }
      .desk-bar { padding: 10px 12px 12px; }
      .desk-bar #send { min-width: 96px; padding: 0 14px; }
    }
  </style>
</head>

    /* ==================================================================
       A0 — Chat foundations. Types, telemetry, time, and the single API
       adapter. This app is one static page served by FastAPI, so the
       addendum's file tree lands here as named sections rather than
       modules. The boundaries it asks for still hold: one adapter owns
       every fetch, one time module owns every timestamp, and no message
       body is ever logged.
       ==================================================================

       @typedef {'ne'|'en'} Lang
       @typedef {'member'|'bhasa'} MessageAuthor
       @typedef {'sending'|'sent'|'failed'} MessageStatus
         (no 'streaming' — /v1/support/chat returns one whole response)
       @typedef {'offline'|'timeout'|'unauthorized'|'rate_limited'|'server'|'unknown'} FailureCode
       @typedef {'online'|'offline'|'session_expired'} ConnectionState

       Message  { clientId, id, conversationId, author, body, romanSource,
                  createdAt, status, failureCode, canListen }
       Conversation { id, preview, updatedAt, isDraft }
       Ticket   { id, subject, openedAt }
    */

    const SEND_TIMEOUT_MS = 20000;
    const MAX_MESSAGE_CHARS = 2000;
    const COUNTER_AT = 1800;
    const STICK_THRESHOLD_PX = 120;

    /* A0.19 — telemetry. No analytics client exists in this repo, so
       track() is a no-op behind the interface. Message text never
       enters an event; length is bucketed (A0.12). */
    function track(event, props) {
      void event; void props;
    }
    function lengthBucket(text) {
      const n = (text || "").length;
      return n < 40 ? "<40" : (n <= 160 ? "40-160" : ">160");
    }

    /* A0.10 — the one adapter. Every Chat fetch goes through here, and
       this is the only place that maps transport failures onto a
       FailureCode. Server-supplied error strings are never rendered
       (they arrive in English and would break the WO10 language pass). */
    const api = {
      async request(path, options) {
        const opts = options || {};
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort("timeout"), opts.timeoutMs || SEND_TIMEOUT_MS);
        if (typeof navigator !== "undefined" && navigator.onLine === false) {
          clearTimeout(timer);
          throw { failureCode: "offline" };
        }
        try {
          const res = await fetch(path, {
            method: opts.method || "GET",
            headers: opts.headers,
            body: opts.body,
            signal: controller.signal
          });
          let data = null;
          try { data = await res.json(); } catch { data = null; }
          if (!res.ok) throw { failureCode: api.codeForStatus(res.status) };
          return data;
        } catch (err) {
          if (err && err.failureCode) throw err;
          if (err && (err.name === "AbortError" || err === "timeout")) throw { failureCode: "timeout" };
          throw { failureCode: navigator.onLine === false ? "offline" : "unknown" };
        } finally {
          clearTimeout(timer);
        }
      },
      codeForStatus(status) {
        if (status === 401 || status === 403) return "unauthorized";
        if (status === 429) return "rate_limited";
        if (status >= 500) return "server";
        return "unknown";
      },
      json(path, body, extraHeaders) {
        return api.request(path, {
          method: "POST",
          headers: Object.assign({ "Content-Type": "application/json" }, extraHeaders || {}),
          body: JSON.stringify(body)
        });
      },
      /* The backend creates the conversation implicitly on first chat,
         which is exactly the D2 default: New chat is a client-side
         draft and writes nothing until the officer sends. */
      sendMessage(payload, clientId) {
        return api.json("/v1/support/chat", payload, { "Idempotency-Key": clientId });
      },
      unicoder(text) {
        return api.request("/v1/support/unicoder", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
          timeoutMs: 6000
        });
      },
      speak(text, locale) {
        return api.json("/v1/support/speak", { text, locale });
      },
      /* Adapter shim: the store returns `preview`/`updated_at`, not
         `lastMessagePreview`/`lastMessageAt`, and has no unreadCount.
         Normalised here so no component sees the raw row. */
      async conversations(channel) {
        const rows = await api.request("/v1/support/conversations?channel=" + encodeURIComponent(channel));
        return (Array.isArray(rows) ? rows : []).map((row) => ({
          id: row.id,
          preview: row.preview || "",
          updatedAt: row.updated_at || row.created_at || null,
          messageCount: row.message_count || 0,
          isDraft: false
        }));
      },
      async messages(conversationId) {
        const data = await api.request("/v1/support/conversations/" + conversationId);
        return (data && data.messages) || [];
      },
      /* SYNTHESISED: the endpoint has no ?status=open filter and no
         `reference` field, so open tickets are filtered client-side and
         the id doubles as the reference. Real rows, not mock data. */
      async openTickets() {
        const rows = await api.request("/v1/support/tickets");
        return (Array.isArray(rows) ? rows : [])
          .filter((row) => row.status !== "resolved")
          .map((row) => ({ id: row.id, subject: row.subject || row.status, openedAt: row.created_at || null }));
      }
    };

    function paintChips() {

      wrap.innerHTML = "";

    /* The helper line has one reserved height (see .unicoder in CSS) so
       the composer never jumps when the preview appears — A0.6 rule 3
       satisfies WO6 by reservation, not animation. */
    function paintUnicoderHint(preview) {
      unicoderHint.innerHTML = "";
      const over = box.value.length > MAX_MESSAGE_CHARS;
      const near = box.value.length >= COUNTER_AT;
      if (over) {
        unicoderHint.className = "unicoder err";
        unicoderHint.textContent = t().tooLong;
        return;
      }
      if (replyLang === "ne" && preview && preview !== box.value) {
        unicoderHint.className = "unicoder";
        const label = document.createElement("span");
        label.textContent = t().unicoderLabel;
        const value = document.createElement("span");
        value.lang = "ne";
        value.textContent = preview;
        unicoderHint.append(label, value);
        /* A0.6 rule 6 — a quiet escape hatch when conversion guesses
           wrong. Deliberately a text toggle, not a second gold button. */
        const asTyped = document.createElement("button");
        asTyped.type = "button";
        asTyped.className = "as-typed" + (sendAsTyped ? " on" : "");
        asTyped.setAttribute("aria-pressed", sendAsTyped ? "true" : "false");
        asTyped.textContent = t().sendAsTyped;
        asTyped.addEventListener("click", () => {
          sendAsTyped = !sendAsTyped;
          convertComposer();
        });
        unicoderHint.append(asTyped);
        if (near) unicoderHint.append(counterEl());
        return;
      }
      unicoderHint.className = "unicoder idle";
      unicoderHint.textContent = replyLang === "ne" ? t().unicoderHint : t().unicoderHintEn;
      if (near) unicoderHint.append(counterEl());
    }

    function counterEl() {
      const el = document.createElement("span");
      el.className = "char-count";
      const shown = replyLang === "ne"
        ? neNum(box.value.length) + " / " + neNum(MAX_MESSAGE_CHARS)
        : box.value.length + " / " + MAX_MESSAGE_CHARS;
      el.textContent = shown;
      return el;
    }

    const NE_DIGITS = ["०", "१", "२", "३", "४", "५", "६", "७", "८", "९"];
    function neNum(value) { return String(value).replace(/\d/g, (d) => NE_DIGITS[d]); }
    function hasDevanagari(text) { return /[ऀ-ॿ]/.test(text || ""); }

    function humanTime(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (isNaN(d.getTime())) return "";
      const now = new Date();
      const mins = Math.floor((now.getTime() - d.getTime()) / 60000);
      if (mins < 1) return t().timeNow;
      if (mins < 60) return t().timeMinutes.replace("{n}", replyLang === "ne" ? neNum(mins) : String(mins));
      if (d.toDateString() === now.toDateString()) return t().timeToday;
      if (d.toDateString() === new Date(now.getTime() - 86400000).toDateString()) return t().timeYesterday;
      try {
        return d.toLocaleDateString(replyLang === "ne" ? "ne-NP" : "en-GB", { day: "numeric", month: "short" });
      } catch {
        return String(iso).slice(0, 10);
      }
    }

    function growBox() {
      box.style.height = "auto";
      box.style.height = Math.min(box.scrollHeight, 168) + "px";
    }

    /* A0.6 rule 4 — a broken transliterator must never become a broken
       product. Any failure falls back to the roman as typed. */
    async function toUnicoder(text) {
      const raw = text || "";
      if (!raw || !hasLatin(raw)) return raw;
      try {
        const data = await api.unicoder(raw);
        return (data && data.nepali) ? data.nepali : raw;
      } catch {
        return raw;
      }
    }

    /* A0.6 rule 1 — the textarea always holds exactly what the officer
       typed. Rewriting it in place destroys the cursor position and
       makes the box unusable, so the Nepali only ever appears on the
       read-only preview line below. Stale responses are discarded by
       sequence number (rule 2). */
    async function convertComposer() {
      const typed = box.value;
      if (!hasLatin(typed) || replyLang !== "ne") {
        paintUnicoderHint();
        return typed;
      }
      const req = ++unicoderReq;
      const converted = await toUnicoder(typed);
      if (req !== unicoderReq) return typed;
      paintUnicoderHint(converted);
      return converted;
    }

    function showWelcome() {
      log.innerHTML = "";
      const el = document.createElement("div");
      el.className = "welcome";

      title.textContent = t().welcomeTitle;
      const body = document.createElement("p");
      body.textContent = t().welcomeBody;
      const hint = document.createElement("p");
      hint.className = "welcome__hint";
      hint.textContent = t().welcomeHint;
      el.append(title, body, hint);
      log.appendChild(el);
      started = false;
      chatId = null;
      logStick = true;
    }

    function addTurn(host, role, text, isErr) {
      if (host === log && !started) { host.innerHTML = ""; started = true; }
      const isMember = role === "user" || role === "member";
      const wrap = document.createElement("div");
      wrap.className = "turn " + (isMember ? "member" : "agent") + (isErr ? " err" : "");
      const who = document.createElement("div");
      who.className = "who";
      /* WO9 — You never sits on the left, Bhasa never on the right, and
         the label follows the language switch. */
      who.textContent = isMember ? t().member : t().agent;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      /* A0.3 — tag the run so the right font applies. Historical
         bodies are never re-rendered when the officer switches
         language; only the chrome around them changes. */
      bubble.lang = hasDevanagari(text) ? "ne" : "en";
      wrap.append(who, bubble);
      host.appendChild(wrap);
      if (host === log) stickToBottom();
      else host.scrollTop = host.scrollHeight;
      return bubble;
    }

    function addAgent(text, isErr, meta) {
      const bubble = addTurn(log, "agent", text, isErr);
      if (meta && meta.tickets && meta.tickets.length) {
        const note = document.createElement("div");
        note.className = "who";
        note.textContent = t().ticketPrefix + meta.tickets.join(", ");
        bubble.parentNode.appendChild(note);
      }
      if (!isErr) {
        const play = document.createElement("button");
        play.type = "button";
        play.className = "play";
        play.textContent = t().play;
        play.addEventListener("click", () => {
          track("chat_listen_used", {});
          speakReply(text, false);
        });
        bubble.parentNode.appendChild(play);
        speakReply(text, false);
      }
      stickToBottom();
    }

    function showLoading(host) {
      const el = document.createElement("div");
      el.className = "turn agent";
      el.id = host === callLog ? "call-pending" : "pending";
      el.innerHTML = '<div class="who">' + t().agent + '</div><div class="bubble loading"><span class="dots"><span></span><span></span><span></span></span></div>';
      host.appendChild(el);
      host.scrollTop = host.scrollHeight;
    }

    /* WO5 State 1 — dots plus the line, on the left where Bhasa's
       bubble will land. Announced once via aria-live, not per frame:
       the label is inside the live region, the dots are not. */
    function showWriting() {
      const el = document.createElement("div");
      el.className = "turn agent writing";
      el.id = "pending";
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = t().agent;
      const row = document.createElement("div");
      row.className = "bubble loading";
      const dots = document.createElement("span");
      dots.className = "dots";
      dots.setAttribute("aria-hidden", "true");
      dots.innerHTML = "<span></span><span></span><span></span>";
      const label = document.createElement("span");
      label.className = "writing__label";
      label.textContent = t().writing;
      row.append(dots, label);
      el.append(who, row);
      log.appendChild(el);
      stickToBottom();
    }

    /* A0.5 — follow new messages only when the officer is already at
       the end. If they scrolled up to read, hold their place and offer
       a quiet way back. */
    function atBottom() {
      return log.scrollHeight - log.scrollTop - log.clientHeight <= STICK_THRESHOLD_PX;
    }
    function stickToBottom(force) {
      if (force || logStick) log.scrollTop = log.scrollHeight;
      paintJump();
    }
    function paintJump() {
      const jump = document.getElementById("jump-latest");
      jump.textContent = t().jumpLatest;
      jump.hidden = logStick || !started;
    }

    /* A0.8 — connection banner. Sits above the composer; the inbox and
       the write bar stay usable behind it. */
    function setConnection(state) {
      connection = state;
      const banner = document.getElementById("conn-banner");
      const text = document.getElementById("conn-text");
      const action = document.getElementById("conn-action");
      if (state === "online") {
        banner.hidden = true;
        paintSendEnabled();
        return;
      }
      banner.hidden = false;
      text.textContent = state === "offline" ? t().offline : t().sessionEnded;
      action.hidden = state !== "session_expired";
      action.textContent = t().signIn;
      paintSendEnabled();
    }

    /* WO6 — Send is faded when there is nothing to send, when a send is
       in flight, or when the line is down. One rule, one place. */
    function paintSendEnabled() {
      const text = box.value.trim();
      const tooLong = box.value.length > MAX_MESSAGE_CHARS;
      send.disabled = !text || tooLong || sendInFlight || connection !== "online";
    }

    function clearLoading(id) {
      const pending = document.getElementById(id);
      if (pending) pending.remove();
    }

    async function speakReply(text, wait) {
      if (!text) return;
      if (!wait && !speakOn) return;
      try {
        const res = await fetch("/v1/support/speak", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, locale: replyLang })
        });
        const data = await res.json();
        if (res.ok && data.audio_base64) {
          if (lastAudio) lastAudio.pause();
          lastAudio = new Audio("data:" + (data.mime || "audio/mpeg") + ";base64," + data.audio_base64);
          const done = lastAudio.play().catch(() => {});
          if (wait) await new Promise((resolve) => { lastAudio.onended = resolve; lastAudio.onerror = resolve; });
          await done;
        }
      } catch {}
    }

    async function playPayload(data) {
      if (!data || !data.audio_base64) return;
      if (lastAudio) lastAudio.pause();
      lastAudio = new Audio("data:" + (data.mime || "audio/mpeg") + ";base64," + data.audio_base64);
      try { await lastAudio.play(); } catch {}
      await new Promise((resolve) => { lastAudio.onended = resolve; lastAudio.onerror = resolve; });
    }

    /* A0.7 — one in-flight send at a time, never a queue. `clientId` is
       generated once and reused by every retry, so a retry can never
       duplicate a message in front of a member. */
    function newClientId() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    }

    function setBusy(busy) {
      sendInFlight = busy;
      log.setAttribute("aria-busy", busy ? "true" : "false");
      paintSendEnabled();
      mic.disabled = busy;
    }

    async function sendText(message, options) {
      const opts = options || {};
      if (!message || sendInFlight) return;
      const clientId = opts.clientId || newClientId();
      let shown = message;
      const romanSource = opts.romanSource || (hasLatin(message) ? message : undefined);
      if (!opts.asTyped && hasLatin(message)) shown = await toUnicoder(message);

      const turn = opts.retryTurn || addTurn(log, "member", shown);
      const wrap = turn.closest(".turn");
      wrap.classList.remove("err");
      clearFailure(wrap);
      wrap.dataset.clientId = clientId;
      wrap.dataset.body = "";
      setBusy(true);
      showWriting();
      track("chat_message_sent", {
        lang: replyLang,
        viaChip: !!opts.viaChip,
        lengthBucket: lengthBucket(shown)
      });
      try {
        const data = await api.sendMessage(
          { message: shown, conversation_id: chatId, locale: replyLang, channel: "chat" },
          clientId
        );
        chatId = data.conversation_id;
        if (data.transliterated) turn.textContent = data.transliterated;
        clearLoading("pending");
        setConnection("online");
        addAgent(data.reply, false, data);
        loadInbox("chat");
        loadTickets();
        loadHome();
      } catch (err) {
        const code = (err && err.failureCode) || "unknown";
        clearLoading("pending");
        /* Never render a server string — map the code to our own copy,
           so Nepali mode stays Nepali when the backend fails. */
        markFailed(wrap, { clientId, body: shown, romanSource, code });
        track("chat_send_failed", { failureCode: code });
        if (code === "offline") setConnection("offline");
        else if (code === "unauthorized") setConnection("session_expired");
      } finally {
        setBusy(false);
        box.focus();
      }
    }

    /* WO9 + WO5 State 2 — the failed member bubble keeps its place in
       the thread and carries a quiet text retry, never a second gold
       Send. The icon is the non-colour cue required by A0.18. */
    function markFailed(wrap, info) {
      wrap.classList.add("err");
      const note = document.createElement("div");
      note.className = "fail-note";
      note.setAttribute("role", "alert");
      const icon = document.createElement("span");
      icon.className = "fail-note__icon";
      icon.setAttribute("aria-hidden", "true");
      icon.textContent = "!";
      const text = document.createElement("span");
      text.textContent = t().sendFailed;
      const again = document.createElement("button");
      again.type = "button";
      again.className = "fail-note__retry";
      again.textContent = t().retry;
      again.addEventListener("click", () => {
        const bubble = wrap.querySelector(".bubble");
        sendText(info.body, {
          clientId: info.clientId,
          romanSource: info.romanSource,
          retryTurn: bubble,
          asTyped: true
        });
      });
      note.append(icon, text, again);
      wrap.appendChild(note);
    }

    function clearFailure(wrap) {
      const note = wrap.querySelector(".fail-note");
      if (note) note.remove();
    }

    function listenChat() {
      const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Rec) { addAgent(t().micErr, true); return; }
      const rec = new Rec();
      rec.lang = replyLang === "ne" ? "ne-NP" : "en-US";
      rec.interimResults = false;
      rec.onresult = (event) => {
        const text = event.results[0][0].transcript;
        if (text) sendText(text);
      };
      rec.onerror = () => addAgent(t().hearErr, true);
      rec.start();
      mic.classList.add("hot");
      rec.onend = () => mic.classList.remove("hot");
    }

    async function loadInbox(channel) {
      const kind = channel || (view === "call" ? "call" : "chat");
      if (kind === "chat") {
        try {
          paintChatInbox(await api.conversations("chat"));
        } catch {
          paintChatInbox([]);
        }
        return;
      }
      const res = await fetch("/v1/support/conversations?channel=" + encodeURIComponent(kind));
      const rows = await res.json();
      const list = document.getElementById("inbox-list");
      list.innerHTML = "";
      if (!Array.isArray(rows) || !rows.length) {
        list.innerHTML = '<div class="empty">' + t().emptyInbox + "</div>";
        return;
      }
      const active = kind === "call" ? callId : chatId;
      rows.forEach((row) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "thread" + (row.id === active ? " on" : "");
        const when = (row.updated_at || "").slice(0, 16).replace("T", " ");
        btn.innerHTML = '<div class="meta">' + when + '</div><div class="preview"></div>';
        btn.querySelector(".preview").textContent = row.preview || row.id.slice(0, 8);
        btn.addEventListener("click", () => openThread(row.id, kind));
        list.appendChild(btn);
      });
    }

    function paintChatInbox(rows) {
      const c = t();
      const list = document.getElementById("chat-list");
      document.getElementById("chat-inbox-count").textContent =
        replyLang === "ne" ? neNum(rows.length) : String(rows.length);
      list.innerHTML = "";
      if (!rows.length) {
        const empty = document.createElement("div");
        empty.className = "chat-inbox__empty";
        const title = document.createElement("strong");
        title.textContent = c.inboxEmptyTitle;
        const help = document.createElement("span");
        help.textContent = c.inboxEmptyHelp;
        empty.append(title, help);
        list.appendChild(empty);
        return;
      }
      rows.forEach((row) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "convo" + (row.id === chatId ? " on" : "");
        const preview = document.createElement("span");
        preview.className = "convo__preview";
        preview.textContent = row.preview || c.inboxNewRowLabel;
        preview.lang = hasDevanagari(preview.textContent) ? "ne" : "en";
        const time = document.createElement("span");
        time.className = "convo__time";
        time.textContent = humanTime(row.updatedAt);
        btn.append(time, preview);
        btn.addEventListener("click", () => openThread(row.id, "chat"));
        list.appendChild(btn);
      });
    }

    async function openThread(id, kind) {
      if (kind !== "call") {
        let messages = [];
        try { messages = await api.messages(id); } catch { messages = []; }
        chatId = id;
        started = true;
        log.innerHTML = "";
        messages.forEach((msg) => addTurn(log, msg.role === "user" ? "member" : "agent", msg.content));
        logStick = true;
        stickToBottom(true);
        loadInbox("chat");
        box.focus();
        return;
      }
      const res = await fetch("/v1/support/conversations/" + id);
      const data = await res.json();
      if (kind === "call") {
        callId = id;
        callLog.innerHTML = "";
        (data.messages || []).forEach((msg) => addTurn(callLog, msg.role, msg.content));
        loadInbox("call");
        return;
      }
      chatId = id;
      started = true;
      log.innerHTML = "";
      (data.messages || []).forEach((msg) => addTurn(log, msg.role === "user" ? "member" : "agent", msg.content));
      loadInbox("chat");
      box.focus();
    }

    async function loadTickets() {
      const boxEl = document.getElementById("ticket-list");
      boxEl.innerHTML = "";
      let open = [];
      try { open = await api.openTickets(); } catch { open = []; }
      if (!open.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = t().emptyTickets;
        boxEl.appendChild(empty);
        return 0;
      }
      open.slice(0, 8).forEach((row) => {
        const el = document.createElement("div");
        el.className = "ticket";
        el.textContent = row.id + " · " + row.subject;
        boxEl.appendChild(el);
      });
      return open.length;
    }

    async function loadHome() {
      try {
        const [chats, calls, tickets] = await Promise.all([
          fetch("/v1/support/conversations?channel=chat").then((r) => r.json()),
          fetch("/v1/support/conversations?channel=call").then((r) => r.json()),
          fetch("/v1/support/tickets").then((r) => r.json())
        ]);
        document.getElementById("stat-chat").textContent = Array.isArray(chats) ? chats.length : 0;
        document.getElementById("stat-call").textContent = Array.isArray(calls) ? calls.length : 0;
        const open = (Array.isArray(tickets) ? tickets : []).filter((row) => row.status !== "resolved");
        document.getElementById("stat-ticket").textContent = open.length;
      } catch {}
    }

    function setCallUi(on) {
      callLive = on;
      document.getElementById("ring").classList.toggle("live", on);
      document.getElementById("status-dot").classList.toggle("busy", on);
      document.getElementById("live").textContent = on ? t().liveOn : t().liveIdle;
      document.getElementById("pickup").classList.toggle("hidden", on);
      document.getElementById("hangup").classList.toggle("hidden", !on);
    }

    async function pickup() {
      if (callLive) return;
      setCallUi(true);
      callLog.innerHTML = "";
      showLoading(callLog);
      try {
        const res = await fetch("/v1/support/calls/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ locale: replyLang })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : res.statusText);
        callId = data.conversation_id;
        clearLoading("call-pending");
        addTurn(callLog, "agent", data.reply);
        loadInbox("call");
        loadHome();
        await playPayload(data);
        if (callLive) listenCall();
      } catch (err) {
        clearLoading("call-pending");
        addTurn(callLog, "agent", String(err.message || err), true);
        setCallUi(false);
      }
    }

    function hangup() {
      callLive = false;
      callBusy = false;
      if (callRec) { try { callRec.stop(); } catch {} callRec = null; }
      if (lastAudio) { lastAudio.pause(); lastAudio = null; }
      setCallUi(false);
      loadInbox("call");
    }

    function listenCall() {
      if (!callLive || callBusy) return;
      const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Rec) { addTurn(callLog, "agent", t().micErr, true); return; }
      const rec = new Rec();
      callRec = rec;
      rec.lang = replyLang === "ne" ? "ne-NP" : "en-US";
      rec.interimResults = false;
      rec.onresult = async (event) => {
        const text = event.results[0][0].transcript;
        if (!text || !callLive) return;
        callBusy = true;
        try { rec.stop(); } catch {}
        await sendCallTurn(text);
        callBusy = false;
        if (callLive) listenCall();
      };
      rec.onerror = () => {
        if (callLive && !callBusy) addTurn(callLog, "agent", t().hearErr, true);
      };
      rec.onend = () => {
        callRec = null;
        if (callLive && !callBusy) setTimeout(() => { if (callLive && !callBusy) listenCall(); }, 500);
      };
      try { rec.start(); } catch {}
    }

    async function sendCallTurn(message) {
      let shown = message;
      if (hasLatin(message)) shown = await toUnicoder(message);
      addTurn(callLog, "member", shown);
      showLoading(callLog);
      try {
        const res = await fetch("/v1/support/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: shown, conversation_id: callId, locale: replyLang, channel: "call" })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : res.statusText);
        callId = data.conversation_id;
        clearLoading("call-pending");
        addTurn(callLog, "agent", data.reply);
        loadInbox("call");
        await speakReply(data.reply, true);
      } catch (err) {
        clearLoading("call-pending");
        addTurn(callLog, "agent", String(err.message || err), true);
      }
    }

    document.querySelectorAll(".sidebar nav button").forEach((btn) => {
      btn.addEventListener("click", () => setView(btn.getAttribute("data-view")));
    });
    document.querySelectorAll(".door").forEach((btn) => {
      btn.addEventListener("click", () => setView(btn.getAttribute("data-go")));
    });
    document.getElementById("lang-ne").addEventListener("click", () => {
      replyLang = "ne";
      localStorage.setItem("bhasa-lang", "ne");
      paintChrome();
      if (view === "chat") loadInbox("chat");
    });
    document.getElementById("lang-en").addEventListener("click", () => {
      replyLang = "en";
      localStorage.setItem("bhasa-lang", "en");
      paintChrome();
      if (view === "chat") loadInbox("chat");
    });
    document.getElementById("speak-toggle").addEventListener("click", () => {
      speakOn = !speakOn;
      localStorage.setItem("bhasa-speak", speakOn ? "on" : "off");
      paintChrome();
    });
    themeToggle.addEventListener("click", () => setTheme(!isDark()));
    try {
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (event) => {
        if (!localStorage.getItem("bhasa-theme")) {
          document.documentElement.classList.toggle("dark", event.matches);
          document.documentElement.style.colorScheme = event.matches ? "dark" : "light";
          paintTheme();
        }
      });
    } catch (e) {}
    document.getElementById("new-thread").addEventListener("click", () => {
      if (view === "call") { hangup(); callId = null; callLog.innerHTML = ""; }
      else showWelcome();
      loadInbox();
    });
    document.getElementById("chat-new").addEventListener("click", () => {
      showWelcome();
      loadInbox("chat");
      box.focus();
    });
    mic.addEventListener("click", listenChat);
    /* A0.6 rule 7 — while an IME is composing, do not transliterate and
       do not send. Without this guard a real Nepali keyboard fires
       Enter mid-word and sends half a sentence. */
    box.addEventListener("compositionstart", () => { isComposing = true; });
    box.addEventListener("compositionend", () => { isComposing = false; scheduleConvert(); });
    function scheduleConvert() {
      clearTimeout(unicoderTimer);
      unicoderTimer = setTimeout(() => { if (!isComposing) convertComposer(); }, 120);
    }
    box.addEventListener("input", () => {
      growBox();
      paintSendEnabled();
      paintUnicoderHint();
      if (!isComposing) scheduleConvert();
    });
    box.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" || event.shiftKey) return;
      if (isComposing || event.isComposing || event.keyCode === 229) return;
      event.preventDefault();
      if (send.disabled) return;
      if (typeof form.requestSubmit === "function") form.requestSubmit();
      else form.dispatchEvent(new Event("submit", { cancelable: true }));
    });
    box.addEventListener("paste", (event) => {
      const clip = event.clipboardData || window.clipboardData;
      const pasted = clip ? clip.getData("text") || "" : "";
      const selected = box.selectionEnd - box.selectionStart;
      const room = MAX_MESSAGE_CHARS - (box.value.length - selected);
      if (pasted.length <= room) return;
      /* A0.11 — cap an over-long paste visibly rather than dropping
         text silently under the officer's cursor. */
      event.preventDefault();
      const start = box.selectionStart;
      const end = box.selectionEnd;
      const kept = pasted.slice(0, Math.max(0, room));
      box.value = box.value.slice(0, start) + kept + box.value.slice(end);
      box.selectionStart = box.selectionEnd = start + kept.length;
      growBox();
      paintSendEnabled();
      unicoderHint.className = "unicoder err";
      unicoderHint.textContent = t().tooLong;
    });
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (send.disabled || isComposing) return;
      const typed = box.value.trim();
      if (!typed) return;
      /* The converted Devanagari is the message body; the roman the
         officer typed is kept as romanSource. */
      const converted = sendAsTyped ? typed : ((await convertComposer()) || typed).trim();
      box.value = "";
      sendAsTyped = false;
      growBox();
      paintSendEnabled();
      paintUnicoderHint();
      logStick = true;
      sendText(converted, { romanSource: typed, asTyped: true });
    });
    log.addEventListener("scroll", () => {
      logStick = atBottom();
      paintJump();
    });
    document.getElementById("jump-latest").addEventListener("click", () => {
      logStick = true;
      stickToBottom(true);
      box.focus();
    });
    document.getElementById("conn-action").addEventListener("click", () => {
      window.location.reload();
    });
    window.addEventListener("online", () => setConnection("online"));
    window.addEventListener("offline", () => setConnection("offline"));
    document.getElementById("pickup").addEventListener("click", pickup);
    document.getElementById("hangup").addEventListener("click", hangup);

    /* A0.17 — relative labels refresh on a single interval, not on
       every render, so "५ मिनेट" does not go stale in a quiet inbox. */
    setInterval(() => { if (view === "chat") loadInbox("chat"); }, 60000);

    setConnection(navigator.onLine === false ? "offline" : "online");
    paintSendEnabled();
    setView("home");
  </script>
</body>
</html>
