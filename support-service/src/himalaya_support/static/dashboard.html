<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>भाषा · डेसबोर्ड</title>
  <meta name="theme-color" id="theme-color" content="#f4fbf8" />
  <link rel="icon" href="/static/cloudfrm-logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("bhasa-theme");
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {}
    })();
  </script>
  <style>
    /* ------------------------------------------------------------------
       Theme — Material 3 tokens taken from cloudfrm.ai (light + .dark).
       ------------------------------------------------------------------ */
    :root {
      color-scheme: light;
      --md-sys-color-primary: #006a60;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #74f8e5;
      --md-sys-color-on-primary-container: #00201c;
      --md-sys-color-secondary: #4a635f;
      --md-sys-color-secondary-container: #cce8e2;
      --md-sys-color-on-secondary-container: #05201c;
      --md-sys-color-tertiary: #456179;
      --md-sys-color-error: #ba1a1a;
      --md-sys-color-on-error: #ffffff;
      --md-sys-color-error-container: #ffdad6;
      --md-sys-color-on-error-container: #410002;
      --md-sys-color-background: #f4fbf8;
      --md-sys-color-on-background: #161d1b;
      --md-sys-color-surface: #f4fbf8;
      --md-sys-color-on-surface: #161d1b;
      --md-sys-color-on-surface-variant: #3f4947;
      --md-sys-color-outline: #6f7977;
      --md-sys-color-outline-variant: #bec9c6;
      --md-sys-color-surface-container-lowest: #ffffff;
      --md-sys-color-surface-container-low: #eff5f2;
      --md-sys-color-surface-container: #e9efec;
      --md-sys-color-surface-container-high: #e3eae7;
      --md-sys-color-surface-container-highest: #dde4e1;
      --shadow-card: 0 12px 32px rgba(22, 29, 27, 0.08);
      --shadow-bar: 0 -10px 28px rgba(22, 29, 27, 0.08);
    }
    html.dark {
      color-scheme: dark;
      --md-sys-color-primary: #53dbc9;
      --md-sys-color-on-primary: #003731;
      --md-sys-color-primary-container: #005048;
      --md-sys-color-on-primary-container: #74f8e5;
      --md-sys-color-secondary: #b1ccc6;
      --md-sys-color-secondary-container: #334b47;
      --md-sys-color-on-secondary-container: #cce8e2;
      --md-sys-color-tertiary: #adcae5;
      --md-sys-color-error: #ffb4ab;
      --md-sys-color-on-error: #690005;
      --md-sys-color-error-container: #93000a;
      --md-sys-color-on-error-container: #ffdad6;
      --md-sys-color-background: #0e1513;
      --md-sys-color-on-background: #dde4e1;
      --md-sys-color-surface: #0e1513;
      --md-sys-color-on-surface: #dde4e1;
      --md-sys-color-on-surface-variant: #bec9c6;
      --md-sys-color-outline: #899391;
      --md-sys-color-outline-variant: #3f4947;
      --md-sys-color-surface-container-lowest: #090f0e;
      --md-sys-color-surface-container-low: #161d1b;
      --md-sys-color-surface-container: #1a2120;
      --md-sys-color-surface-container-high: #252b2a;
      --md-sys-color-surface-container-highest: #303635;
      --shadow-card: 0 18px 44px rgba(0, 0, 0, 0.42);
      --shadow-bar: 0 -12px 32px rgba(0, 0, 0, 0.35);
    }
    :root {
      /* semantic aliases used by the layout */
      --bg: var(--md-sys-color-background);
      --ink: var(--md-sys-color-on-surface);
      --muted: var(--md-sys-color-on-surface-variant);
      --line: var(--md-sys-color-outline-variant);
      --line-soft: color-mix(in srgb, var(--md-sys-color-outline-variant) 55%, transparent);
      --panel: var(--md-sys-color-surface-container-low);
      --panel-2: var(--md-sys-color-surface-container);
      --panel-3: var(--md-sys-color-surface-container-high);
      --panel-4: var(--md-sys-color-surface-container-highest);
      --well: var(--md-sys-color-surface-container-lowest);
      --primary: var(--md-sys-color-primary);
      --on-primary: var(--md-sys-color-on-primary);
      --primary-soft: var(--md-sys-color-primary-container);
      --on-primary-soft: var(--md-sys-color-on-primary-container);
      --accent-soft: var(--md-sys-color-secondary-container);
      --on-accent-soft: var(--md-sys-color-on-secondary-container);
      --danger: var(--md-sys-color-error);
      --on-danger: var(--md-sys-color-on-error);
      --danger-soft: var(--md-sys-color-error-container);
      --on-danger-soft: var(--md-sys-color-on-error-container);
      --primary-12: color-mix(in srgb, var(--md-sys-color-primary) 12%, transparent);
      --primary-30: color-mix(in srgb, var(--md-sys-color-primary) 30%, transparent);
      --primary-45: color-mix(in srgb, var(--md-sys-color-primary) 45%, transparent);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; width: 100%; margin: 0; }
    body {
      color: var(--ink);
      font-family: "Noto Sans Devanagari", "Segoe UI", Roboto, system-ui, sans-serif;
      background:
        radial-gradient(900px 520px at 88% -12%, var(--primary-12), transparent 62%),
        var(--bg);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    /* ------------------------------------------------------------------
       Shell: left menu + main card
       ------------------------------------------------------------------ */
    .app {
      position: relative;
      z-index: 1;
      height: 100vh;
      width: 100%;
      display: grid;
      grid-template-columns: 248px 1fr;
      gap: 14px;
      padding: 14px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line-soft);
      box-shadow: var(--shadow-card);
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      padding: 22px 16px;
      min-height: 0;
      border-radius: 24px;
    }
    .brand { display: flex; gap: 12px; align-items: center; margin: 0 4px 26px; }
    .mark {
      width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
      display: block; object-fit: cover;
      background: #000005;
      border: 1px solid var(--line-soft);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
    }
    .brand h1 { margin: 0; font-size: 24px; font-weight: 700; line-height: 1.2; color: var(--ink); }
    .brand small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; line-height: 1.4; }
    .sidebar nav { display: flex; flex-direction: column; gap: 4px; }
    .sidebar nav button {
      text-align: left;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      font-size: 15px;
      padding: 11px 14px;
      border-radius: 14px;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
    }
    .sidebar nav button:hover { background: var(--panel-3); color: var(--ink); }
    .sidebar nav button.active {
      background: var(--accent-soft);
      color: var(--on-accent-soft);
      border-color: transparent;
    }
    .sidebar .grow { flex: 1; }
    .lang-switch { display: flex; gap: 6px; }
    .pill {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 999px;
      padding: 7px 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background .15s, border-color .15s, color .15s;
    }
    .pill:hover { background: var(--panel-3); }
    .pill.active {
      background: var(--primary);
      color: var(--on-primary);
      border-color: var(--primary);
    }
    .pill svg { display: block; }
    html.dark .pill .i-moon, html:not(.dark) .pill .i-sun { display: none; }
    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      border-radius: 24px;
      overflow: hidden;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 14px 24px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--line-soft);
      flex-shrink: 0;
    }
    .topbar h2 { margin: 0; font-size: 19px; font-weight: 700; color: var(--ink); }
    .status { display: flex; align-items: center; gap: 8px; color: var(--primary); font-weight: 600; font-size: 13px; margin-top: 2px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 8px var(--primary-45); }
    .dot.busy { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .stage { flex: 1; min-height: 0; display: grid; background: var(--bg); }
    .stage.home, .stage.settings { grid-template-columns: 1fr; }
    .stage.work { grid-template-columns: 300px 1fr; }

    /* ------------------------------------------------------------------
       Home / Settings
       ------------------------------------------------------------------ */
    .home, .settings { padding: 36px 40px; overflow: auto; }
    .home h2, .settings h2 { margin: 0 0 8px; font-size: 28px; font-weight: 700; }
    .lede, .settings p { margin: 0; color: var(--muted); line-height: 1.6; max-width: 640px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin: 28px 0;
    }
    .stat, .door {
      background: var(--panel-2);
      border: 1px solid var(--line-soft);
      border-radius: 20px;
      padding: 20px;
      transition: transform .2s, border-color .2s, background .2s;
    }
    .stat span, .door span { display: block; color: var(--muted); font-size: 13px; font-weight: 600; }
    .stat strong { display: block; font-size: 32px; margin-top: 8px; font-weight: 700; color: var(--primary); }
    .doors { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .door { cursor: pointer; text-align: left; color: inherit; width: 100%; }
    .door:hover { border-color: var(--primary); background: var(--panel-3); transform: translateY(-2px); }
    .door h3 { margin: 8px 0 6px; font-size: 22px; font-weight: 700; }
    .door p { margin: 0; color: var(--muted); line-height: 1.6; }

    /* ------------------------------------------------------------------
       Call (inbox + stage)
       ------------------------------------------------------------------ */
    .inbox {
      background: var(--panel);
      border-right: 1px solid var(--line-soft);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .inbox header {
      padding: 16px 16px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .inbox h3 { margin: 0; font-size: 15px; }
    .inbox .new {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 999px;
      padding: 5px 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .inbox .new:hover { background: var(--panel-3); }
    .inbox .list { overflow: auto; flex: 1; padding: 0 10px 12px; }
    .thread {
      width: 100%; text-align: left; border: 1px solid transparent; background: transparent;
      border-radius: 12px; padding: 10px; cursor: pointer; color: inherit;
    }
    .thread:hover, .thread.on { background: var(--panel-3); border-color: var(--line-soft); }
    .thread .meta { font-size: 11px; color: var(--muted); font-weight: 600; }
    .thread .preview {
      margin-top: 4px; font-size: 13px; line-height: 1.6;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .tickets h4 { margin: 0 0 8px; font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
    .ticket { font-size: 13px; color: var(--muted); padding: 4px 0; }
    .desk { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
    #log, #call-log { flex: 1; overflow: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .call-stage { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .ring {
      margin: 36px auto 0; width: 168px; height: 168px; border-radius: 50%;
      display: grid; place-items: center;
      background: var(--panel-3);
      border: 6px solid var(--primary-45);
      font-size: 42px; font-weight: 700; color: var(--primary);
      box-shadow: 0 0 40px var(--primary-12);
    }
    .ring.live { border-color: var(--danger); box-shadow: 0 0 0 10px color-mix(in srgb, var(--danger) 18%, transparent); }
    .call-copy { text-align: center; margin: 16px 24px 0; }
    .call-copy h3 { margin: 0 0 6px; font-size: 24px; font-weight: 700; }
    .call-copy p { margin: 0; color: var(--muted); }
    .call-actions { display: flex; justify-content: center; gap: 10px; padding: 18px; }
    .call-actions button {
      border: 0; border-radius: 14px; padding: 12px 16px; font-weight: 700; cursor: pointer;
    }
    #pickup { background: var(--primary); color: var(--on-primary); min-width: 180px; }
    #hangup { background: var(--danger); color: var(--on-danger); min-width: 140px; }
    .empty { color: var(--muted); font-size: 13px; padding: 8px; }
    button:disabled { opacity: .55; }
    .hidden { display: none !important; }

    /* ------------------------------------------------------------------
       Message turns (shared by Chat and Call)
       ------------------------------------------------------------------ */
    .turn { display: flex; flex-direction: column; gap: 6px; max-width: 720px; }
    .turn.member { align-self: flex-end; align-items: flex-end; }
    .who { font-size: 12px; color: var(--muted); font-weight: 600; }
    .bubble {
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.75;
      white-space: pre-wrap;
      font-size: 15px;
      color: var(--ink);
    }
    .agent .bubble { background: var(--panel-3); border: 1px solid var(--line-soft); border-top-left-radius: 6px; }
    .member .bubble {
      background: var(--accent-soft);
      color: var(--on-accent-soft);
      border: 1px solid var(--primary-30);
      border-top-right-radius: 6px;
    }
    .err .bubble { background: var(--danger-soft); border-color: var(--danger); color: var(--on-danger-soft); }
    .play { border: 0; background: transparent; color: var(--primary); font-size: 13px; font-weight: 600; cursor: pointer; padding: 0 4px; }
    .loading { color: var(--muted); display: flex; align-items: center; gap: 10px; }
    .dots { display: inline-flex; gap: 4px; }
    .dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); animation: bounce 1s infinite ease-in-out; }
    .dots span:nth-child(2) { animation-delay: .15s; }
    .dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: .35; }
      40% { transform: translateY(-5px); opacity: 1; }
    }
    .unicoder { min-height: 22px; margin-top: 8px; color: var(--primary); font-weight: 600; font-size: 15px; line-height: 1.6; }
    .unicoder.idle { color: var(--muted); font-weight: 500; font-size: 13px; }

    /* ------------------------------------------------------------------
       Chat room — three zones: inbox (left) · conversation (middle) ·
       write bar (planted at the bottom of the conversation).
       ------------------------------------------------------------------ */
    .stage.chat-room { grid-template-columns: minmax(280px, 26%) minmax(0, 1fr); }

    /* Zone 1 — inbox */
    .chat-inbox {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      background: var(--panel);
      border-right: 1px solid var(--line-soft);
      position: relative;
      z-index: 1;
    }
    .chat-inbox__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 14px 12px 16px;
      border-bottom: 1px solid var(--line-soft);
      flex-shrink: 0;
    }
    .chat-inbox__head h3 { margin: 0; min-width: 0; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; color: var(--ink); }
    .chat-inbox__head h3 > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-inbox__head .chat-inbox__new { flex-shrink: 0; }
    .chat-inbox__count {
      min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px;
      background: var(--panel-4); color: var(--muted);
      font-size: 12px; font-weight: 700; display: inline-grid; place-items: center;
    }
    .chat-inbox__new {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, border-color .15s;
    }
    .chat-inbox__new:hover { background: var(--panel-3); border-color: var(--primary); }
    .chat-inbox__list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      scrollbar-width: thin;
    }
    .chat-inbox__list .empty { padding: 22px 12px; text-align: center; line-height: 1.7; }
    .convo {
      position: relative;
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 12px;
      padding: 11px 12px 11px 18px;
      cursor: pointer;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex-shrink: 0;
      transition: background .15s, border-color .15s;
    }
    .convo::before {
      content: "";
      position: absolute;
      left: 7px; top: 13px; bottom: 13px; width: 3px;
      border-radius: 3px;
      background: transparent;
    }
    .convo:hover { background: var(--panel-3); }
    .convo.on { background: var(--panel-3); border-color: var(--line-soft); }
    .convo.on::before { background: var(--primary); }
    .convo__top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .convo__name { font-size: 13.5px; font-weight: 700; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .convo__time { font-size: 11.5px; color: var(--muted); font-weight: 600; flex-shrink: 0; }
    .convo__preview {
      font-size: 13.5px;
      line-height: 1.7;
      color: var(--ink);
      opacity: .85;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: anywhere;
    }
    .convo__meta { font-size: 11.5px; color: var(--muted); display: flex; gap: 6px; }
    .chat-inbox__foot {
      border-top: 1px solid var(--line-soft);
      padding: 10px 16px 12px;
      max-height: 34%;
      overflow: auto;
      flex-shrink: 0;
      background: var(--panel-2);
    }
    .chat-inbox__foot .ticket { color: var(--ink); padding: 5px 0; line-height: 1.5; border-bottom: 1px solid var(--line-soft); }
    .chat-inbox__foot .ticket:last-child { border-bottom: 0; }
    .chat-inbox__foot .empty { padding: 4px 0; }

    /* Zone 2 — conversation */
    .room {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      background: var(--bg);
    }
    .room__head {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 13px 24px;
      border-bottom: 1px solid var(--line-soft);
      background: var(--panel);
    }
    .room__title { margin: 0; font-size: 16px; font-weight: 700; color: var(--ink); }
    .room__sub { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.6; }
    .room__tag {
      flex-shrink: 0;
      font-size: 12px; font-weight: 700; color: var(--primary);
      border: 1px solid var(--primary-45); border-radius: 999px;
      padding: 4px 11px; background: var(--primary-12);
      white-space: nowrap;
    }
    .room #log {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 22px 28px 18px;
      gap: 16px;
      scrollbar-width: thin;
    }
    .room .turn { max-width: min(720px, 84%); }
    .room .turn.agent { align-items: flex-start; }
    .room .who { font-size: 11.5px; padding: 0 4px; }
    .room .welcome {
      background: var(--panel-2);
      border: 1px solid var(--line-soft);
      border-radius: 16px;
      margin: 6px 0 0;
      max-width: 560px;
      padding: 20px 22px;
      flex-shrink: 0;
    }
    .room .welcome h2 { margin: 0 0 6px; font-size: 22px; line-height: 1.4; font-weight: 700; }
    .room .welcome p { margin: 0; color: var(--muted); line-height: 1.75; }

    /* Zone 3 — write bar */
    .desk-bar {
      flex-shrink: 0;
      background: var(--panel-2);
      border-top: 1px solid var(--line-soft);
      box-shadow: var(--shadow-bar);
      padding: 10px 20px 12px;
      position: relative;
      z-index: 1;
    }
    .desk-bar__topics {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 10px;
    }
    .desk-bar__topics-label {
      font-size: 11px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .08em; flex-shrink: 0;
    }
    #chips { display: flex; flex-wrap: wrap; gap: 6px; }
    #chips button {
      flex-shrink: 0;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, border-color .15s;
    }
    #chips button:hover { border-color: var(--primary); background: var(--primary-12); }
    .desk-bar form { display: flex; align-items: flex-end; gap: 10px; }
    .desk-bar textarea {
      flex: 1;
      min-width: 0;
      min-height: 52px;
      max-height: 168px;
      resize: none;
      padding: 13px 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--well);
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      line-height: 1.7;
      overflow-y: auto;
    }
    .desk-bar textarea::placeholder { color: var(--md-sys-color-outline); }
    .desk-bar textarea:focus { outline: 2px solid var(--primary-45); outline-offset: 1px; border-color: var(--primary); }
    .desk-bar #mic, .desk-bar #send {
      height: 52px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }
    .desk-bar #mic {
      min-width: 52px;
      padding: 0 14px;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 18px;
    }
    .desk-bar #mic:hover { background: var(--panel-3); }
    .desk-bar #mic.hot { background: var(--danger); color: var(--on-danger); border-color: var(--danger); }
    .desk-bar #send {
      min-width: 136px;
      padding: 0 20px;
      border: 0;
      background: var(--primary);
      color: var(--on-primary);
      font-size: 15px;
    }
    .desk-bar #send:hover { filter: brightness(1.08); }

    @media (prefers-reduced-motion: reduce) {
      .door, .convo, .pill { transition: none; }
    }
    @media (max-width: 960px) {
      body { overflow: auto; }
      .app { grid-template-columns: 1fr; height: auto; min-height: 100vh; }
      .sidebar { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px; }
      .brand { margin: 0; }
      .sidebar nav { flex-direction: row; flex-wrap: wrap; }
      .sidebar .grow { display: none; }
      .stage.work { grid-template-columns: 1fr; }
      .inbox { max-height: 180px; border-right: 0; border-bottom: 1px solid var(--line-soft); }
      .stats, .doors { grid-template-columns: 1fr; }
      .home, .settings { padding: 20px 16px; }
      .stage.chat-room { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
      .chat-inbox { max-height: 240px; border-right: 0; border-bottom: 1px solid var(--line-soft); }
      .chat-inbox__foot { display: none; }

      .room #log { padding: 16px; }
      .desk-bar { padding: 10px 12px 12px; }
      .desk-bar #send { min-width: 96px; padding: 0 14px; }

      document.documentElement.classList.toggle("dark", dark);
      document.documentElement.style.colorScheme = dark ? "dark" : "light";
      try { localStorage.setItem("bhasa-theme", dark ? "dark" : "light"); } catch (e) {}
      paintTheme();
    }

      if (work) loadInbox();

        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = replyLang === "ne" ? row.ne : row.en;
        btn.addEventListener("click", () => sendText(replyLang === "ne" ? row.neMsg : row.enMsg));
        wrap.appendChild(btn);
      });
    }

    function paintUnicoderHint(preview) {
      if (replyLang !== "ne") {
        unicoderHint.textContent = t().unicoderHint;
        unicoderHint.className = "unicoder idle";
        if (preview && preview !== box.value) {
          unicoderHint.className = "unicoder";
          unicoderHint.textContent = t().unicoderLabel + preview;
        }
        return;
      }
      if (preview && preview !== box.value) {
        unicoderHint.className = "unicoder";
        unicoderHint.textContent = t().unicoderLabel + preview;
        return;
      }
      unicoderHint.className = "unicoder idle";
      unicoderHint.textContent = t().unicoderHint;
    }

    function fmtWhen(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (isNaN(d.getTime())) return String(iso).slice(0, 16).replace("T", " ");
      const loc = replyLang === "ne" ? "ne-NP" : "en-GB";
      const sameDay = d.toDateString() === new Date().toDateString();
      try {
        return sameDay
          ? d.toLocaleTimeString(loc, { hour: "2-digit", minute: "2-digit" })
          : d.toLocaleDateString(loc, { day: "numeric", month: "short" });
      } catch {
        return String(iso).slice(0, 16).replace("T", " ");
      }
    }

    function paintRoomHead() {
      const c = t();
      const titleEl = document.getElementById("room-title");
      const subEl = document.getElementById("room-sub");
      if (!chatId) {
        titleEl.textContent = c.roomNew;
        subEl.textContent = c.roomNewSub;
        return;
      }
      const turns = log.querySelectorAll(".turn:not(#pending)").length;
      const meta = convoMeta[chatId] || {};
      let sub = turns + " " + c.roomMsgs;
      if (meta.created_at) sub += " · " + c.roomSince + " " + fmtWhen(meta.created_at);
      titleEl.textContent = c.roomThread + " " + chatId.slice(0, 8).toUpperCase();
      subEl.textContent = sub;
    }

    function growBox() {
      box.style.height = "auto";
      box.style.height = Math.min(box.scrollHeight, 168) + "px";
    }

    async function toUnicoder(text) {
      const raw = text || "";
      if (!raw || !hasLatin(raw)) return raw;
      const res = await fetch("/v1/support/unicoder", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: raw })
      });
      const data = await res.json();
      return (res.ok && data.nepali) ? data.nepali : raw;
    }

    function pendingLatin(value) {
      const match = value.match(/[A-Za-z']+$/);
      return match ? match[0] : "";
    }

    async function convertComposer(commitCurrent) {
      const typed = box.value;
      if (!hasLatin(typed)) {
        paintUnicoderHint();
        return typed;
      }
      const req = ++unicoderReq;
      const converted = await toUnicoder(typed);
      if (req !== unicoderReq) return typed;
      paintUnicoderHint(converted);
      const shouldReplace = commitCurrent || !pendingLatin(typed);
      if (replyLang === "ne" && shouldReplace && converted && converted !== typed && box.value === typed) {
        box.value = converted;
        growBox();
        paintUnicoderHint();
      }
      return converted;
    }

    function showWelcome() {
      log.innerHTML = "";
      const el = document.createElement("div");
      el.className = "welcome";
      el.innerHTML = "<h2>" + t().welcomeTitle + "</h2><p>" + t().welcomeBody + "</p>";
      log.appendChild(el);
      started = false;
      chatId = null;
      paintRoomHead();
    }

    function addTurn(host, role, text, isErr) {
      if (host === log && !started) { host.innerHTML = ""; started = true; }
      const wrap = document.createElement("div");
      wrap.className = "turn " + (role === "user" || role === "member" ? "member" : "agent") + (isErr ? " err" : "");
      wrap.innerHTML = '<div class="who">' + (wrap.classList.contains("member") ? t().member : t().agent) + "</div>";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      wrap.appendChild(bubble);
      host.appendChild(wrap);
      host.scrollTop = host.scrollHeight;
      return bubble;
    }

    function addAgent(text, isErr, meta) {
      const bubble = addTurn(log, "agent", text, isErr);
      if (meta && meta.tickets && meta.tickets.length) {
        const note = document.createElement("div");
        note.className = "who";
        note.textContent = t().ticketPrefix + meta.tickets.join(", ");
        bubble.parentNode.appendChild(note);
      }
      if (!isErr) {
        const play = document.createElement("button");
        play.type = "button";
        play.className = "play";
        play.textContent = t().play;
        play.addEventListener("click", () => speakReply(text, false));
        bubble.parentNode.appendChild(play);
        speakReply(text, false);
      }
    }

    function showLoading(host) {
      const el = document.createElement("div");
      el.className = "turn agent";
      el.id = host === callLog ? "call-pending" : "pending";
      el.innerHTML = '<div class="who">' + t().agent + '</div><div class="bubble loading"><span class="dots"><span></span><span></span><span></span></span></div>';
      host.appendChild(el);
      host.scrollTop = host.scrollHeight;
    }

    function clearLoading(id) {
      const pending = document.getElementById(id);
      if (pending) pending.remove();
    }

    async function speakReply(text, wait) {
      if (!text) return;
      if (!wait && !speakOn) return;
      try {
        const res = await fetch("/v1/support/speak", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, locale: replyLang })
        });
        const data = await res.json();
        if (res.ok && data.audio_base64) {
          if (lastAudio) lastAudio.pause();
          lastAudio = new Audio("data:" + (data.mime || "audio/mpeg") + ";base64," + data.audio_base64);
          const done = lastAudio.play().catch(() => {});
          if (wait) await new Promise((resolve) => { lastAudio.onended = resolve; lastAudio.onerror = resolve; });
          await done;
        }
      } catch {}
    }

    async function playPayload(data) {
      if (!data || !data.audio_base64) return;
      if (lastAudio) lastAudio.pause();
      lastAudio = new Audio("data:" + (data.mime || "audio/mpeg") + ";base64," + data.audio_base64);
      try { await lastAudio.play(); } catch {}
      await new Promise((resolve) => { lastAudio.onended = resolve; lastAudio.onerror = resolve; });
    }

    async function sendText(message) {
      if (!message || send.disabled) return;
      let shown = message;
      if (hasLatin(message)) shown = await toUnicoder(message);
      lastMemberBubble = addTurn(log, "member", shown);
      send.disabled = true;
      mic.disabled = true;
      showLoading(log);
      try {
        const res = await fetch("/v1/support/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: shown, conversation_id: chatId, locale: replyLang, channel: "chat" })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : res.statusText);
        chatId = data.conversation_id;
        if (data.transliterated && lastMemberBubble) lastMemberBubble.textContent = data.transliterated;
        clearLoading("pending");
        addAgent(data.reply, false, data);
        paintRoomHead();
        loadInbox("chat");
        loadTickets();
        loadHome();
      } catch (err) {
        clearLoading("pending");
        addAgent(String(err.message || err), true);
      } finally {
        send.disabled = false;
        mic.disabled = false;
        box.focus();
      }
    }

    function listenChat() {
      const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Rec) { addAgent(t().micErr, true); return; }
      const rec = new Rec();
      rec.lang = replyLang === "ne" ? "ne-NP" : "en-US";
      rec.interimResults = false;
      rec.onresult = (event) => {
        const text = event.results[0][0].transcript;
        if (text) sendText(text);
      };
      rec.onerror = () => addAgent(t().hearErr, true);
      rec.start();
      mic.classList.add("hot");
      rec.onend = () => mic.classList.remove("hot");
    }

    async function loadInbox(channel) {
      const kind = channel || (view === "call" ? "call" : "chat");
      const res = await fetch("/v1/support/conversations?channel=" + encodeURIComponent(kind));
      const rows = await res.json();
      if (kind === "chat") { paintChatInbox(Array.isArray(rows) ? rows : []); return; }
      const list = document.getElementById("inbox-list");
      list.innerHTML = "";
      if (!Array.isArray(rows) || !rows.length) {
        list.innerHTML = '<div class="empty">' + t().emptyInbox + "</div>";
        return;
      }
      const active = kind === "call" ? callId : chatId;
      rows.forEach((row) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "thread" + (row.id === active ? " on" : "");
        const when = (row.updated_at || "").slice(0, 16).replace("T", " ");
        btn.innerHTML = '<div class="meta">' + when + '</div><div class="preview"></div>';
        btn.querySelector(".preview").textContent = row.preview || row.id.slice(0, 8);
        btn.addEventListener("click", () => openThread(row.id, kind));
        list.appendChild(btn);
      });
    }

    function paintChatInbox(rows) {
      const c = t();
      const list = document.getElementById("chat-list");
      document.getElementById("chat-inbox-count").textContent = rows.length;
      list.innerHTML = "";
      convoMeta = {};
      rows.forEach((row) => { convoMeta[row.id] = row; });
      if (!rows.length) {
        list.innerHTML = '<div class="empty">' + c.emptyInbox + "</div>";
        paintRoomHead();
        return;
      }
      rows.forEach((row) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "convo" + (row.id === chatId ? " on" : "");
        btn.innerHTML =
          '<div class="convo__top"><span class="convo__name"></span><span class="convo__time"></span></div>' +
          '<div class="convo__preview"></div>' +
          '<div class="convo__meta"><span class="convo__count"></span></div>';
        btn.querySelector(".convo__name").textContent = c.memberRow + " · " + row.id.slice(0, 8).toUpperCase();
        btn.querySelector(".convo__time").textContent = fmtWhen(row.updated_at);
        btn.querySelector(".convo__preview").textContent = row.preview || "—";
        btn.querySelector(".convo__count").textContent = (row.message_count || 0) + " " + c.roomMsgs + (row.locale ? " · " + row.locale : "");
        btn.addEventListener("click", () => openThread(row.id, "chat"));
        list.appendChild(btn);
      });
      paintRoomHead();
    }

    async function openThread(id, kind) {
      const res = await fetch("/v1/support/conversations/" + id);
      const data = await res.json();
      if (kind === "call") {
        callId = id;
        callLog.innerHTML = "";
        (data.messages || []).forEach((msg) => addTurn(callLog, msg.role, msg.content));
        loadInbox("call");
        return;
      }
      chatId = id;
      started = true;
      log.innerHTML = "";
      (data.messages || []).forEach((msg) => addTurn(log, msg.role === "user" ? "member" : "agent", msg.content));
      paintRoomHead();
      loadInbox("chat");
      box.focus();
    }

    async function loadTickets() {
      const res = await fetch("/v1/support/tickets");
      const rows = await res.json();
      const boxEl = document.getElementById("ticket-list");
      boxEl.innerHTML = "";
      const open = (Array.isArray(rows) ? rows : []).filter((row) => row.status !== "resolved");
      if (!open.length) {
        boxEl.innerHTML = '<div class="empty">' + t().emptyTickets + "</div>";
        return open.length;
      }
      open.slice(0, 8).forEach((row) => {
        const el = document.createElement("div");
        el.className = "ticket";
        el.textContent = (row.id || "") + " · " + (row.subject || row.status);
        boxEl.appendChild(el);
      });
      return open.length;
    }

    async function loadHome() {
      try {
        const [chats, calls, tickets] = await Promise.all([
          fetch("/v1/support/conversations?channel=chat").then((r) => r.json()),
          fetch("/v1/support/conversations?channel=call").then((r) => r.json()),
          fetch("/v1/support/tickets").then((r) => r.json())
        ]);
        document.getElementById("stat-chat").textContent = Array.isArray(chats) ? chats.length : 0;
        document.getElementById("stat-call").textContent = Array.isArray(calls) ? calls.length : 0;
        const open = (Array.isArray(tickets) ? tickets : []).filter((row) => row.status !== "resolved");
        document.getElementById("stat-ticket").textContent = open.length;
      } catch {}
    }

    function setCallUi(on) {
      callLive = on;
      document.getElementById("ring").classList.toggle("live", on);
      document.getElementById("status-dot").classList.toggle("busy", on);
      document.getElementById("live").textContent = on ? t().liveOn : t().liveIdle;
      document.getElementById("pickup").classList.toggle("hidden", on);
      document.getElementById("hangup").classList.toggle("hidden", !on);
    }

    async function pickup() {
      if (callLive) return;
      setCallUi(true);
      callLog.innerHTML = "";
      showLoading(callLog);
      try {
        const res = await fetch("/v1/support/calls/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ locale: replyLang })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : res.statusText);
        callId = data.conversation_id;
        clearLoading("call-pending");
        addTurn(callLog, "agent", data.reply);
        loadInbox("call");
        loadHome();
        await playPayload(data);
        if (callLive) listenCall();
      } catch (err) {
        clearLoading("call-pending");
        addTurn(callLog, "agent", String(err.message || err), true);
        setCallUi(false);
      }
    }

    function hangup() {
      callLive = false;
      callBusy = false;
      if (callRec) { try { callRec.stop(); } catch {} callRec = null; }
      if (lastAudio) { lastAudio.pause(); lastAudio = null; }
      setCallUi(false);
      loadInbox("call");
    }

    function listenCall() {
      if (!callLive || callBusy) return;
      const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Rec) { addTurn(callLog, "agent", t().micErr, true); return; }
      const rec = new Rec();
      callRec = rec;
      rec.lang = replyLang === "ne" ? "ne-NP" : "en-US";
      rec.interimResults = false;
      rec.onresult = async (event) => {
        const text = event.results[0][0].transcript;
        if (!text || !callLive) return;
        callBusy = true;
        try { rec.stop(); } catch {}
        await sendCallTurn(text);
        callBusy = false;
        if (callLive) listenCall();
      };
      rec.onerror = () => {
        if (callLive && !callBusy) addTurn(callLog, "agent", t().hearErr, true);
      };
      rec.onend = () => {
        callRec = null;
        if (callLive && !callBusy) setTimeout(() => { if (callLive && !callBusy) listenCall(); }, 500);
      };
      try { rec.start(); } catch {}
    }

    async function sendCallTurn(message) {
      let shown = message;
      if (hasLatin(message)) shown = await toUnicoder(message);
      addTurn(callLog, "member", shown);
      showLoading(callLog);
      try {
        const res = await fetch("/v1/support/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: shown, conversation_id: callId, locale: replyLang, channel: "call" })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : res.statusText);
        callId = data.conversation_id;
        clearLoading("call-pending");
        addTurn(callLog, "agent", data.reply);
        loadInbox("call");
        await speakReply(data.reply, true);
      } catch (err) {
        clearLoading("call-pending");
        addTurn(callLog, "agent", String(err.message || err), true);
      }
    }

    document.querySelectorAll(".sidebar nav button").forEach((btn) => {
      btn.addEventListener("click", () => setView(btn.getAttribute("data-view")));
    });
    document.querySelectorAll(".door").forEach((btn) => {
      btn.addEventListener("click", () => setView(btn.getAttribute("data-go")));
    });
    document.getElementById("lang-ne").addEventListener("click", () => {
      replyLang = "ne";
      localStorage.setItem("bhasa-lang", "ne");
      paintChrome();
      if (view === "chat") loadInbox("chat");
    });
    document.getElementById("lang-en").addEventListener("click", () => {
      replyLang = "en";
      localStorage.setItem("bhasa-lang", "en");
      paintChrome();
      if (view === "chat") loadInbox("chat");
    });
    document.getElementById("speak-toggle").addEventListener("click", () => {
      speakOn = !speakOn;
      localStorage.setItem("bhasa-speak", speakOn ? "on" : "off");
      paintChrome();
    });
    themeToggle.addEventListener("click", () => setTheme(!isDark()));
    try {
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (event) => {
        if (!localStorage.getItem("bhasa-theme")) {
          document.documentElement.classList.toggle("dark", event.matches);
          document.documentElement.style.colorScheme = event.matches ? "dark" : "light";
          paintTheme();
        }
      });
    } catch (e) {}
    document.getElementById("new-thread").addEventListener("click", () => {
      if (view === "call") { hangup(); callId = null; callLog.innerHTML = ""; }
      else showWelcome();
      loadInbox();
    });
    document.getElementById("chat-new").addEventListener("click", () => {
      showWelcome();
      loadInbox("chat");
      box.focus();
    });
    mic.addEventListener("click", listenChat);
    box.addEventListener("input", () => {
      growBox();
      clearTimeout(unicoderTimer);
      const typed = box.value;
      const commit = /[\s?؟।.!,\u0964]$/.test(typed) || !pendingLatin(typed);
      unicoderTimer = setTimeout(() => convertComposer(commit), commit ? 40 : 90);
    });
    box.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" || event.shiftKey || event.isComposing) return;
      event.preventDefault();
      if (typeof form.requestSubmit === "function") form.requestSubmit();
      else form.dispatchEvent(new Event("submit", { cancelable: true }));
    });
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const converted = await convertComposer(true);
      const message = (converted || box.value).trim();
      box.value = "";
      growBox();
      paintUnicoderHint();
      sendText(message);
    });
    document.getElementById("pickup").addEventListener("click", pickup);
    document.getElementById("hangup").addEventListener("click", hangup);

    setView("home");
  </script>
</body>
</html>
